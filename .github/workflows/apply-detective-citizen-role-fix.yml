name: Apply detective citizen role fix

on:
  push:
    branches:
      - main
    paths:
      - .github/detective-fix-trigger

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch and validate detective logic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          content = path.read_text(encoding='utf-8')

          old = """                    if (roleData && roleData.value === 'mafia_chameleon') {
                        touchCard.style.backgroundColor = '#34c759'; document.getElementById(`night-label-${seatId}`).textContent = 'مواطن ✅';
                    } else if (roleData && roleData.group === 'mafia_team') {
                        touchCard.style.backgroundColor = '#e50914'; document.getElementById(`night-label-${seatId}`).textContent = 'مافيا 🩸';
                    } else if (roleData && roleData.group === 'solo_team') {
                        touchCard.style.backgroundColor = '#ff9500'; document.getElementById(`night-label-${seatId}`).textContent = 'سفاح 🔪';
                    } else {
                        touchCard.style.backgroundColor = '#34c759'; document.getElementById(`night-label-${seatId}`).textContent = 'مواطن ✅';
                    }
"""

          new = """                    if (roleData && roleData.value === 'mafia_chameleon') {
                        touchCard.style.backgroundColor = '#34c759';
                        document.getElementById(`night-label-${seatId}`).textContent = 'مواطن عادي 👤';
                    } else if (roleData && roleData.group === 'mafia_team') {
                        touchCard.style.backgroundColor = '#e50914';
                        document.getElementById(`night-label-${seatId}`).textContent = 'مافيا 🩸';
                    } else if (roleData && roleData.group === 'solo_team') {
                        touchCard.style.backgroundColor = '#ff9500';
                        document.getElementById(`night-label-${seatId}`).textContent = 'سفاح 🔪';
                    } else if (roleData && roleData.group === 'citizen_team') {
                        touchCard.style.backgroundColor = '#34c759';
                        const citizenRoleLabel = trueRoleVal === 'citizen'
                            ? 'مواطن عادي 👤'
                            : getRoleLabel(trueRoleVal);
                        document.getElementById(`night-label-${seatId}`).textContent = citizenRoleLabel;
                    } else {
                        touchCard.style.backgroundColor = '#34c759';
                        document.getElementById(`night-label-${seatId}`).textContent = 'مواطن عادي 👤';
                    }
"""

          if content.count(old) != 1:
              raise SystemExit(f'Expected one detective block, found {content.count(old)}')

          updated = content.replace(old, new, 1)
          required = [
              "const citizenRoleLabel = trueRoleVal === 'citizen'",
              "roleData.group === 'citizen_team'",
              "? 'مواطن عادي 👤'",
              ": getRoleLabel(trueRoleVal);",
          ]
          missing = [item for item in required if item not in updated]
          if missing:
              raise SystemExit(f'Validation failed: {missing}')

          path.write_text(updated, encoding='utf-8')
          PY

      - name: Commit and push index.html
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Reveal citizen roles to detective [skip ci]"
          git push origin HEAD:main

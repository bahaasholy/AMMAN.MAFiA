<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05070c">
  <title>Amman Mafia — شاشة العرض v84</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --gold:#f2c35b;
      --red:#ff4c56;
      --green:#2ce287;
      --blue:#4ea9ff;
      --purple:#b16eff;
      --white:#f7f4ec;
      --muted:#aeb3bf;
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#020307;color:var(--white);font-family:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif}
    body::before{content:"";position:fixed;inset:0;z-index:-2;background:linear-gradient(rgba(1,3,8,.58),rgba(1,2,5,.82)),url("mafia-city-bg.jpg") center/cover no-repeat;filter:brightness(.72) saturate(.78);transform:scale(1.02)}
    body::after{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 32% 38%,rgba(240,190,72,.08),transparent 30%),linear-gradient(90deg,rgba(0,0,0,.35),transparent 20%,transparent 80%,rgba(0,0,0,.35));pointer-events:none}
    button,input{font:inherit}

    .pair-screen{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.64);backdrop-filter:blur(8px)}
    .pair-card{width:min(94vw,620px);padding:34px;text-align:center;border-radius:26px;border:1px solid rgba(242,195,91,.36);background:rgba(7,8,12,.96);box-shadow:0 30px 90px rgba(0,0,0,.58)}
    .pair-logo{width:112px;height:112px;object-fit:cover;border-radius:24px;border:1px solid rgba(242,195,91,.44)}
    .pair-brand{margin-top:16px;color:var(--gold);font-size:2.25rem;font-weight:900;letter-spacing:3px}
    .pair-sub{margin:8px 0 24px;color:#a6abb6;font-weight:700}
    .pair-row{display:flex;gap:10px;direction:ltr}.pair-row input{flex:1;min-width:0;padding:15px;text-align:center;text-transform:uppercase;letter-spacing:4px;color:#fff;font-weight:900;border-radius:13px;border:1px solid rgba(255,255,255,.14);background:#080a0f}.pair-row button{padding:13px 22px;border:0;border-radius:13px;background:var(--gold);color:#090806;font-weight:900;cursor:pointer}
    .pair-msg{min-height:24px;margin-top:14px;color:#d5ccb2}.debug-status{margin-top:8px;color:#7f8490;direction:ltr;font-size:.72rem}.debug-status.error{color:#ff777e}.debug-status.ok{color:#69dc8c}

    .display{display:none;position:fixed;inset:0;overflow:hidden}
    .display.active{display:block}

    /* لوحة تصميم ثابتة 1600×900. يتم تغيير حجمها كوحدة واحدة فقط. */
    .fixed-stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center center;will-change:transform}

    .connection-pill,.round-pill{position:absolute;top:30px;height:58px;min-width:152px;display:flex;align-items:center;justify-content:center;gap:12px;padding:0 22px;border-radius:18px;border:1px solid rgba(255,255,255,.13);background:rgba(5,7,11,.78);box-shadow:0 12px 32px rgba(0,0,0,.25)}
    .connection-pill{left:42px}
    .connection-dot{width:15px;height:15px;border-radius:50%;background:#ff5563;box-shadow:0 0 15px rgba(255,85,99,.9)}
    .connection-pill.online .connection-dot{background:var(--green);box-shadow:0 0 17px rgba(44,226,135,.95)}
    .connection-text{font-size:25px;font-weight:800}

    .phase-title{position:absolute;left:260px;top:24px;width:1080px;height:78px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:54px;font-weight:900;line-height:1;color:#faf9f5;text-shadow:0 3px 15px rgba(0,0,0,.5)}

    .timer-stage{position:absolute;left:70px;top:124px;width:790px;height:592px;display:flex;align-items:center;justify-content:center;border-radius:38px;background:rgba(5,7,12,.30)}
    .timer-wrap{position:relative;width:590px;height:590px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
    .timer-svg{position:absolute;inset:0;width:590px;height:590px;z-index:1;transform:rotate(-90deg);overflow:visible;filter:drop-shadow(0 0 18px rgba(242,195,91,.14))}
    .ring-track{fill:rgba(3,5,9,.86);stroke:rgba(255,255,255,.12);stroke-width:18}
    .ring-progress{fill:none;stroke:var(--gold);stroke-width:18;stroke-linecap:round;transition:stroke-dashoffset .22s linear,stroke .2s linear;filter:drop-shadow(0 0 12px rgba(242,195,91,.48))}
    .ring-inner{fill:rgba(7,9,14,.95);stroke:rgba(255,255,255,.04);stroke-width:2}
    .timer-readout{position:absolute;z-index:5;left:0;right:0;top:50%;transform:translateY(-50%);direction:ltr;text-align:center;font-family:"Arial Black","Segoe UI",Arial,sans-serif;font-variant-numeric:tabular-nums;font-size:112px;line-height:1;font-weight:950;letter-spacing:-8px;color:#fff9ee;text-shadow:0 0 24px rgba(255,255,255,.12),0 0 38px rgba(242,195,91,.13);white-space:nowrap}
    .timer-readout.warning{color:var(--red);text-shadow:0 0 15px rgba(255,76,86,.72),0 0 42px rgba(255,76,86,.28);animation:warnPulse .7s ease-in-out infinite}
    .timer-stage.warning .ring-progress{stroke:var(--red);filter:drop-shadow(0 0 13px rgba(255,76,86,.62))}
    .mute-mark{
      position:absolute;
      z-index:6;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:16px;
      color:#facc15;
      text-align:center;
      text-shadow:
        0 0 18px rgba(250,204,21,.52),
        0 0 48px rgba(250,204,21,.20);
    }
    .mute-mark-icon{
      font-size:118px;
      line-height:1;
      filter:drop-shadow(0 0 18px rgba(250,204,21,.35));
    }
    .mute-mark-text{
      font-family:"Arial Black","Segoe UI",Arial,sans-serif;
      font-size:96px;
      line-height:.9;
      font-weight:950;
      letter-spacing:4px;
    }
    .timer-stage.muted .timer-readout{display:none}
    .timer-stage.muted .mute-mark{display:flex}
    .timer-stage.muted .ring-progress{
      stroke:#facc15 !important;
      filter:drop-shadow(0 0 14px rgba(250,204,21,.58));
    }
    .timer-stage.muted .ring-track{
      stroke:rgba(250,204,21,.18);
    }
    @keyframes warnPulse{0%,100%{transform:translateY(-50%) scale(1)}50%{transform:translateY(-50%) scale(1.035)}}

    .round-pill{right:42px;color:var(--gold)}
    .round-pill-label{font-size:24px;font-weight:900;line-height:1}
    .round-pill-value{font-family:"Arial Black","Segoe UI",Arial,sans-serif;font-size:32px;font-weight:950;line-height:1}
    .speaker-card{position:absolute;right:85px;top:235px;width:570px;height:475px;border-radius:30px;background:linear-gradient(180deg,rgba(10,12,17,.92),rgba(7,9,13,.86));border:1px solid rgba(255,255,255,.09);box-shadow:0 20px 55px rgba(0,0,0,.33);overflow:hidden}
    .speaker-card::after{content:"";position:absolute;left:40px;right:40px;bottom:0;height:5px;border-radius:999px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
    .speaker-label{position:absolute;left:0;right:0;top:56px;text-align:center;color:var(--gold);font-size:46px;font-weight:900}
    .speaker-value{position:absolute;left:0;right:0;top:148px;text-align:center;font-family:"Arial Black","Segoe UI",Arial,sans-serif;font-size:202px;line-height:1;font-weight:950;color:#f8f5ed;text-shadow:0 0 25px rgba(255,255,255,.06)}

    .phase-panel{position:absolute;left:55px;right:55px;top:130px;bottom:196px;display:none;align-items:center;justify-content:center;flex-direction:column;gap:25px;border-radius:38px;background:rgba(6,8,13,.72);border:1px solid rgba(255,255,255,.08);box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center}
    .phase-icon{font-size:130px;line-height:1}.phase-name{font-size:90px;line-height:.9;font-weight:900}.phase-panel.night .phase-name{color:var(--purple)}.phase-panel.voting .phase-name{color:var(--gold)}.phase-panel.idle .phase-name{color:var(--blue)}

    .stats-row{position:absolute;left:55px;right:55px;bottom:24px;height:148px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px;direction:rtl}
    .stat-card{position:relative;display:flex;align-items:center;justify-content:space-between;padding:22px 30px 20px;border-radius:29px;background:linear-gradient(180deg,rgba(16,19,26,.96),rgba(8,10,15,.90));border:1px solid rgba(255,255,255,.11);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 18px 44px rgba(0,0,0,.34);overflow:hidden}.stat-card::before{content:"";position:absolute;left:18px;right:18px;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent)}
    .stat-card::after{content:"";position:absolute;left:18px;right:18px;bottom:0;height:6px;border-radius:999px;background:var(--accent);box-shadow:0 0 14px color-mix(in srgb,var(--accent) 42%,transparent)}
    .stat-title{font-size:33px;font-weight:900;color:#f7f6f2;text-shadow:0 2px 8px rgba(0,0,0,.28)}.stat-value{font-family:"Arial Black","Segoe UI",Arial,sans-serif;font-size:76px;line-height:.95;font-weight:950;color:var(--accent);text-shadow:0 0 18px color-mix(in srgb,var(--accent) 20%,transparent)}
    .stat-alive{--accent:#52afff}.stat-mafia{--accent:#ff5962}.stat-citizen{--accent:#35d07f}.stat-killer{--accent:#b873ff}


    .elimination-overlay{
      --elim-color:#d1d5db;
      position:absolute;
      inset:0;
      z-index:100;
      display:none;
      align-items:center;
      justify-content:center;
      padding:60px;
      background:rgba(2,3,7,.88);
    }
    .elimination-overlay.show{display:flex}
    .elimination-card{
      width:820px;
      min-height:470px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:20px;
      text-align:center;
      border-radius:44px;
      border:3px solid var(--elim-color);
      background:
        radial-gradient(
          circle at 50% 30%,
          color-mix(in srgb,var(--elim-color) 22%,transparent),
          transparent 56%
        ),
        linear-gradient(180deg,rgba(18,10,13,.98),rgba(7,7,11,.98));
      box-shadow:
        0 0 65px color-mix(in srgb,var(--elim-color) 22%,transparent),
        inset 0 0 70px color-mix(in srgb,var(--elim-color) 10%,transparent);
    }
    .elimination-icon{
      font-size:92px;
      line-height:1;
      filter:drop-shadow(
        0 0 22px color-mix(in srgb,var(--elim-color) 36%,transparent)
      );
    }
    .elimination-title{
      color:var(--elim-color);
      font-size:62px;
      line-height:1;
      font-weight:900;
      text-shadow:
        0 0 20px color-mix(in srgb,var(--elim-color) 22%,transparent);
    }
    .elimination-seat-line{
      display:flex;
      align-items:baseline;
      justify-content:center;
      gap:22px;
      color:#d8d8df;
      font-size:42px;
      font-weight:800;
    }
    .elimination-seat{
      color:var(--elim-color);
      font-family:"Arial Black","Segoe UI",Arial,sans-serif;
      font-size:150px;
      line-height:.8;
      font-weight:950;
      text-shadow:
        0 0 18px color-mix(in srgb,var(--elim-color) 70%,transparent),
        0 0 50px color-mix(in srgb,var(--elim-color) 28%,transparent);
    }
    .elimination-overlay.show .elimination-card{
      animation:eliminationReveal .34s ease-out both;
    }
    @keyframes eliminationReveal{
      from{opacity:0;transform:scale(.90)}
      to{opacity:1;transform:scale(1)}
    }


    .live-voting-panel{
      position:absolute;
      left:55px;
      right:55px;
      top:130px;
      bottom:196px;
      z-index:15;
      display:none;
      align-items:center;
      justify-content:flex-start;
      flex-direction:column;
      gap:16px;
      padding:34px 38px 26px;
      border-radius:38px;
      border:1px solid rgba(242,195,91,.22);
      background:
        radial-gradient(circle at 50% 0%,rgba(242,195,91,.08),transparent 42%),
        rgba(6,8,13,.92);
      box-shadow:0 20px 60px rgba(0,0,0,.34);
      overflow:hidden;
      text-align:center;
    }
    body.voting-live .live-voting-panel{display:flex}
    body.voting-live .phase-panel.voting{display:none!important}
    body.voting-defense .live-voting-panel{
      left:0;
      right:0;
      top:0;
      bottom:0;
      padding:0;
      border:none;
      background:transparent;
      box-shadow:none;
      overflow:visible;
    }
    body.voting-defense #liveVotingContent{
      width:100%;
      max-width:none;
      height:100%;
      margin:0;
      display:block;
    }

    #liveVotingContent{
      width:100%;
      max-width:1560px;
      margin:0 auto;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:16px;
    }

    .live-vote-title{
      color:#f7f4ec;
      font-size:clamp(46px,4.3vw,64px);
      line-height:1.06;
      font-weight:900;
      margin:0;
    }
    .live-vote-subtitle{
      color:#9ea3af;
      font-size:24px;
      line-height:1.45;
      margin:0;
    }
    .live-vote-progress{
      width:min(100%,980px);
      min-height:96px;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:16px 28px;
      color:var(--gold);
      font-size:clamp(28px,2.3vw,40px);
      font-weight:900;
      text-align:center;
      border-radius:20px;
      background:rgba(0,0,0,.30);
      border:1px solid rgba(242,195,91,.22);
    }
    .live-tally-list{
      width:100%;
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:18px 20px;
      align-content:start;
      justify-items:stretch;
      max-height:none;
      overflow:visible;
    }
    .live-tally-row{
      width:100%;
      position:relative;
      min-height:98px;
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      align-items:center;
      gap:14px;
      padding:18px 22px 18px;
      border-radius:18px;
      background:
        linear-gradient(180deg,rgba(16,18,25,.94),rgba(10,12,18,.90));
      border:1px solid rgba(255,255,255,.08);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.035),
        0 10px 24px rgba(0,0,0,.16);
      overflow:hidden;
    }
    .live-tally-row::after{
      content:"";
      position:absolute;
      left:16px;
      right:16px;
      bottom:0;
      height:4px;
      border-radius:999px;
      background:linear-gradient(90deg,#b88a2e,var(--gold));
      box-shadow:0 0 10px rgba(242,195,91,.22);
    }
    .live-tally-seat{
      color:#f4f0e6;
      font-size:clamp(22px,1.65vw,31px);
      font-weight:800;
      white-space:nowrap;
      text-align:right;
    }
    .live-tally-votes{
      color:var(--gold);
      font-family:"Arial Black","Segoe UI",Arial,sans-serif;
      font-size:clamp(40px,2.4vw,56px);
      line-height:1;
      text-align:left;
      min-width:40px;
    }
    .live-nominees{
      width:100%;
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      justify-content:center;
      gap:24px;
      margin-top:42px;
      padding:14px 0 24px;
    }
    .live-nominee{
      min-width:230px;
      padding:24px 30px;
      border-radius:26px;
      border:2px solid rgba(242,195,91,.45);
      background:
        linear-gradient(180deg,rgba(17,19,26,.96),rgba(10,12,18,.92));
      box-shadow:
        0 16px 36px rgba(0,0,0,.22),
        inset 0 1px 0 rgba(255,255,255,.04);
    }
    .live-nominee span{
      display:block;
      color:#a8acb7;
      font-size:23px;
    }
    .live-nominee strong{
      display:block;
      margin:6px 0;
      color:var(--gold);
      font-family:"Arial Black","Segoe UI",Arial,sans-serif;
      font-size:68px;
      line-height:1;
    }
    .live-defense-layout{
      position:relative;
      width:100%;
      height:100%;
      direction:ltr;
    }
    .live-defense-timer-stage{
      position:absolute;
      left:70px;
      top:124px;
      width:790px;
      height:592px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:38px;
      background:rgba(5,7,12,.30);
    }
    .live-defense-timer-stage.warning .ring-progress{
      stroke:var(--red);
      filter:drop-shadow(0 0 13px rgba(255,76,86,.62));
    }
    .live-defense-info{
      position:absolute;
      right:85px;
      top:235px;
      width:570px;
      height:475px;
      display:block;
      min-height:0;
      padding:0;
    }
    .live-defense-player-card{
      position:relative;
      width:570px;
      height:475px;
      border-radius:30px;
      background:linear-gradient(180deg,rgba(10,12,17,.92),rgba(7,9,13,.86));
      border:1px solid rgba(255,255,255,.09);
      box-shadow:0 20px 55px rgba(0,0,0,.33);
      overflow:hidden;
    }
    .live-defense-player-card::after{
      content:"";
      position:absolute;
      left:40px;
      right:40px;
      bottom:0;
      height:5px;
      border-radius:999px;
      background:linear-gradient(90deg,transparent,var(--gold),transparent);
    }
    .live-defense-player-label{
      position:absolute;
      left:0;
      right:0;
      top:56px;
      color:var(--gold);
      font-size:46px;
      font-weight:900;
      line-height:1;
      text-align:center;
    }
    .live-defense-player-value{
      position:absolute;
      left:0;
      right:0;
      top:148px;
      text-align:center;
      font-family:"Arial Black","Segoe UI",Arial,sans-serif;
      font-size:202px;
      line-height:1;
      font-weight:950;
      color:#f8f5ed;
      text-shadow:0 0 25px rgba(255,255,255,.06);
    }
    .live-defense-player-note{
      position:absolute;
      left:0;
      right:0;
      bottom:54px;
      color:#9ea3af;
      font-size:27px;
      font-weight:700;
      line-height:1;
      text-align:center;
    }
    .live-defense-seat{
      color:var(--gold);
      font-family:"Arial Black","Segoe UI",Arial,sans-serif;
      font-size:138px;
      line-height:.8;
      text-shadow:0 0 30px rgba(242,195,91,.20);
    }
    .live-defense-timer{
      direction:ltr;
      color:#fff9ef;
      font-family:"Arial Black","Segoe UI",Arial,sans-serif;
      font-size:108px;
      line-height:1;
      font-variant-numeric:tabular-nums;
    }
    .live-exit-grid{
      width:100%;
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      align-items:stretch;
      gap:16px;
      margin-inline:auto;
    }
    .live-exit-card{
      flex:0 1 275px;
      min-width:245px;
      max-width:300px;
      padding:20px 18px;
      border-radius:23px;
      border:1px solid rgba(242,195,91,.20);
      background:rgba(11,13,19,.86);
    }
    .live-exit-card .seat{
      color:#f4f0e6;
      font-size:27px;
      font-weight:900;
    }
    .live-exit-card .votes{
      display:block;
      margin:8px 0;
      color:var(--gold);
      font-family:"Arial Black","Segoe UI",Arial,sans-serif;
      font-size:62px;
      line-height:1;
    }
    .live-exit-card .meta{
      color:#9ea3af;
      font-size:20px;
    }
    .live-result-text{
      max-width:1080px;
      padding:30px 38px;
      color:#f7f4ec;
      font-size:46px;
      line-height:1.35;
      font-weight:900;
      border-radius:30px;
      border:2px solid rgba(242,195,91,.30);
      background:rgba(11,13,19,.88);
    }

    .fullscreen-btn{position:fixed;left:16px;bottom:12px;z-index:20;padding:7px 11px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(5,7,11,.6);color:#d6d8de;font-size:.72rem;font-weight:800;opacity:.18;cursor:pointer}.fullscreen-btn:hover{opacity:1}

    body.phase-discussion .timer-stage,body.phase-discussion .speaker-card,body.phase-discussion .round-pill{display:flex}
    body.phase-voting .timer-stage,body.phase-voting .speaker-card,body.phase-voting .round-pill,
    body.phase-night .timer-stage,body.phase-night .speaker-card,body.phase-night .round-pill,
    body.phase-idle .timer-stage,body.phase-idle .speaker-card,body.phase-idle .round-pill{display:none}
    body.phase-voting .phase-panel.voting,body.phase-night .phase-panel.night,body.phase-idle .phase-panel.idle{display:flex}
    @media (prefers-reduced-motion:reduce){.timer-readout.warning{animation:none}}
  </style>
</head>
<body class="phase-idle">
  <section id="pairScreen" class="pair-screen">
    <div class="pair-card">
      <img class="pair-logo" src="app-icon-master.png" alt="Amman Mafia">
      <div class="pair-brand">AMMAN MAFIA</div>
      <div class="pair-sub">شاشة اللاعبين</div>
      <div class="pair-row"><input id="roomInput" maxlength="14" placeholder="رمز الجلسة" autocomplete="off"><button id="connectBtn" type="button">اتصال</button></div>
      <div id="pairMessage" class="pair-msg"></div><div id="debugStatus" class="debug-status"></div>
    </div>
  </section>

  <main id="displayScreen" class="display">
    <section id="fixedStage" class="fixed-stage">
      <div id="connectionPill" class="connection-pill"><span class="connection-dot"></span><span id="connectionText" class="connection-text">غير متصل</span></div>
      <div id="roundPill" class="round-pill"><span class="round-pill-label">الجولة</span><span id="roundBadge" class="round-pill-value">1</span></div>
      <div id="phaseTitle" class="phase-title">جولة النقاش</div>

      <section id="timerStage" class="timer-stage">
        <div class="timer-wrap">
          <svg class="timer-svg" viewBox="0 0 640 640" aria-hidden="true">
            <circle class="ring-track" cx="320" cy="320" r="270"></circle>
            <circle id="ringProgress" class="ring-progress" cx="320" cy="320" r="270"></circle>
            <circle class="ring-inner" cx="320" cy="320" r="234"></circle>
          </svg>
          <div id="timer" class="timer-readout">00:30</div>
          <div id="muteMark" class="mute-mark" aria-label="اللاعب مسكّت">
            <div class="mute-mark-icon">🔇</div>
            <div class="mute-mark-text">MUTE</div>
          </div>
        </div>
      </section>

            <section class="speaker-card"><div class="speaker-label">لاعب رقم</div><div id="speakerValue" class="speaker-value">10</div></section>

      <section class="phase-panel night"><div class="phase-icon">🌙</div><div class="phase-name">جولة الليل</div></section>
      <section class="phase-panel voting"><div class="phase-icon">🗳️</div><div class="phase-name">جولة التصويت</div></section>
      <section class="phase-panel idle"><div class="phase-icon">⌛</div><div class="phase-name">بانتظار الجولة</div></section>

      <section id="liveVotingPanel" class="live-voting-panel">
        <div id="liveVotingContent"></div>
      </section>

      <section id="eliminationOverlay" class="elimination-overlay" aria-live="assertive">
        <div class="elimination-card">
          <div id="eliminationIcon" class="elimination-icon">💀</div>
          <div id="eliminationTitle" class="elimination-title">
            تم إقصاء اللاعب
          </div>
          <div class="elimination-seat-line">
            <span>اللاعب رقم</span>
            <strong id="eliminationSeat" class="elimination-seat">—</strong>
          </div>
        </div>

      <section class="stats-row">
        <div class="stat-card stat-alive"><div class="stat-title">الأحياء</div><div id="aliveCount" class="stat-value">0</div></div>
        <div class="stat-card stat-mafia"><div class="stat-title">مافيا</div><div id="mafiaCount" class="stat-value">0</div></div>
        <div class="stat-card stat-citizen"><div class="stat-title">مواطن</div><div id="citizenCount" class="stat-value">0</div></div>
        <div class="stat-card stat-killer"><div class="stat-title">سفاح</div><div id="killerCount" class="stat-value">0</div></div>
      </section>

    <button id="fullscreenBtn" class="fullscreen-btn" type="button">ملء الشاشة ⛶</button>
  </main>

  <script>
    (()=>{try{if("caches" in window){caches.keys().then(keys=>keys.filter(k=>k.startsWith("amman-mafia-tv-")&&k!=="amman-mafia-tv-v84-cache-v1").forEach(k=>caches.delete(k)))}}catch(_){}})();
  </script>
  <script src="realtime-config.js?v=84"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
  <script>
  (function(){
    "use strict";
    const PHASE_LABELS={idle:"بانتظار الجولة",discussion:"جولة النقاش",voting:"جولة التصويت",night:"جولة الليل"};
    const RING_RADIUS=270;const RING_CIRCUMFERENCE=2*Math.PI*RING_RADIUS;
    let room="",state=null,client=null,channel=null,localChannel=null,mode="local",transportConnected=false,lastStateAt=0,tick=null,ping=null,syncPoll=null,retryTimer=null,lastLocalWrittenAt=0,timerSyncReceivedAt=0,timerRemainingAtSync=0;
    let eliminationQueue=[];
    let eliminationShowing=false;
    let lastEliminationEventId=0;
    const LOCAL_STATE_PREFIX="ammanMafiaLocalDisplayStateV2:",LOCAL_REQUEST_PREFIX="ammanMafiaLocalDisplayRequestV2:",LOCAL_PRESENCE_PREFIX="ammanMafiaLocalDisplayPresenceV2:";
    const $=id=>document.getElementById(id);

    function fitStage(){
      const stage=$("fixedStage");if(!stage)return;
      const vw=Math.max(320,window.innerWidth||document.documentElement.clientWidth||1600);
      const vh=Math.max(240,window.innerHeight||document.documentElement.clientHeight||900);
      const scale=Math.min(vw/1600,vh/900);
      stage.style.transform=`translate(-50%,-50%) scale(${scale})`;
    }
    window.addEventListener("resize",fitStage);window.addEventListener("orientationchange",fitStage);

    function configured(){const c=window.AMMAN_MAFIA_REALTIME||{};return /^https:\/\/.+\.supabase\.co\/?$/i.test(String(c.supabaseUrl||"").trim())&&String(c.supabaseAnonKey||"").trim().length>40&&!String(c.supabaseAnonKey).includes("PUT_YOUR_")}
    function warningThreshold(){if(!state)return 5000;const d=Math.round(Math.max(0,Number(state.timerDurationMs)||0)/1000);if(d===60)return 15000;if(d===45)return 10000;if(d===30)return 5000;return d>=60?15000:(d>30?10000:5000)}
    function monotonicNow(){return window.performance&&typeof performance.now==="function"?performance.now():Date.now()}
    function remaining(){
      if(!state)return 0;
      if(state.timerStatus==="running"){
        // Count down from the organizer's latest authoritative remaining value.
        // performance.now() is monotonic and is not affected by a TV's system-clock offset.
        return Math.max(0,timerRemainingAtSync-(monotonicNow()-timerSyncReceivedAt));
      }
      return Math.max(0,Number(state.timerRemainingMs||0));
    }
    function formatSeconds(totalSeconds){
      const t=Math.max(0,Math.floor(Number(totalSeconds)||0));
      return `${String(Math.floor(t/60)).padStart(2,"0")}:${String(t%60).padStart(2,"0")}`;
    }
    function authoritativeDisplaySeconds(){
      if(!state)return 0;
      const synced=Number(state.timerDisplaySeconds);
      if(Number.isFinite(synced))return Math.max(0,Math.floor(synced));
      return Math.max(0,Math.ceil(remaining()/1000));
    }
    function apply(payload){
      if(!payload||typeof payload!=="object")return;
      if(payload.roomCode&&room&&String(payload.roomCode)!==room)return;
      state={
        ...payload,
        timerEndsAt:Number(payload.timerEndsAt)||0,
        timerRemainingMs:Math.max(0,Number(payload.timerRemainingMs)||0),
        timerDurationMs:Math.max(1000,Number(payload.timerDurationMs)||60000),
        timerDisplaySeconds:Number.isFinite(Number(payload.timerDisplaySeconds))
          ?Math.max(0,Math.floor(Number(payload.timerDisplaySeconds)))
          :Math.max(0,Math.ceil((Number(payload.timerRemainingMs)||0)/1000))
      };
      timerRemainingAtSync=state.timerRemainingMs;
      timerSyncReceivedAt=monotonicNow();
      lastStateAt=Date.now();
      enqueueEliminationNotice(state);
      render();
    }

    function enqueueEliminationNotice(nextState){
      const eventId=Math.max(
        0,
        Number(nextState && nextState.eliminationEventId) || 0
      );
      const seat=Math.floor(
        Number(nextState && nextState.eliminationSeat) || 0
      );

      if (
        !nextState ||
        !nextState.eliminationActive ||
        !(eventId > lastEliminationEventId) ||
        !(seat > 0)
      ) return;

      lastEliminationEventId=eventId;
      eliminationQueue.push({
        eventId,
        seat,
        type:String(nextState.eliminationType||'manual'),
        title:String(
          nextState.eliminationTitle||'تم إقصاء اللاعب'
        ),
        icon:String(nextState.eliminationIcon||'💀'),
        color:String(nextState.eliminationColor||'#d1d5db')
      });
      showNextEliminationNotice();
    }

    function showNextEliminationNotice(){
      if(eliminationShowing || eliminationQueue.length===0) return;

      const notice=eliminationQueue.shift();
      const overlay=$("eliminationOverlay");
      const seatElement=$("eliminationSeat");
      const titleElement=$("eliminationTitle");
      const iconElement=$("eliminationIcon");

      if(
        !overlay ||
        !seatElement ||
        !titleElement ||
        !iconElement
      ) return;

      eliminationShowing=true;
      seatElement.textContent=String(notice.seat);
      titleElement.textContent=notice.title;
      iconElement.textContent=notice.icon;
      overlay.dataset.type=notice.type;
      overlay.style.setProperty(
        "--elim-color",
        notice.color
      );
      overlay.classList.add("show");

      window.setTimeout(()=>{
        overlay.classList.remove("show");

        window.setTimeout(()=>{
          eliminationShowing=false;
          showNextEliminationNotice();
        },260);
      },3500);
    }

    function localStateKey(){return LOCAL_STATE_PREFIX+room}function localRequestKey(){return LOCAL_REQUEST_PREFIX+room}function localPresenceKey(){return LOCAL_PRESENCE_PREFIX+room}
    function writeLocalSignal(key,payload){try{localStorage.setItem(key,JSON.stringify({...payload,at:Date.now(),nonce:Math.random().toString(36).slice(2)}))}catch(_){}}
    function announcePresence(){if(room)writeLocalSignal(localPresenceKey(),{type:"display-presence"})}function requestLocalState(){if(room)writeLocalSignal(localRequestKey(),{type:"display-request"})}
    function pullLocalState(force=false){if(!room)return false;try{const e=JSON.parse(localStorage.getItem(localStateKey())||"null");if(!e||!e.payload)return false;const w=Number(e.writtenAt)||0;if(!force&&w<=lastLocalWrittenAt)return false;lastLocalWrittenAt=w;apply(e.payload);return true}catch(_){return false}}
    function handleStorageEvent(e){if(room&&e&&e.key===localStateKey())pullLocalState(true)}
    function setConnection(on){$("connectionPill").classList.toggle("online",!!on);$("connectionText").textContent=on?"متصل":"غير متصل"}
    function updateConnection(){setConnection(transportConnected&&(!state||Date.now()-lastStateAt<22000))}
    function updateRing(rem,duration,warning){const ratio=duration>0?Math.max(0,Math.min(1,rem/duration)):0;const ring=$("ringProgress");ring.style.strokeDasharray=String(RING_CIRCUMFERENCE);ring.style.strokeDashoffset=String(RING_CIRCUMFERENCE*(1-ratio));ring.style.stroke=warning?"var(--red)":"var(--gold)"}

    function escapeVotingHtml(value){
      return String(value == null ? "" : value).replace(
        /[&<>"']/g,
        char => ({
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#39;"
        }[char])
      );
    }

    function renderLiveVoting(){
      const panel=$("liveVotingPanel");
      const content=$("liveVotingContent");
      if(!panel||!content||!state)return;

      const isLive=
        state.phase==="voting" &&
        state.votingMode==="live" &&
        !["choice","manual"].includes(state.votingStage);

      panel.style.display=isLive?"flex":"none";

      if(!isLive){
        content.innerHTML="";
        return;
      }

      const stage=state.votingStage;
      const voters=Array.isArray(state.votingVoters)
        ?state.votingVoters
        :[];
      const tallies=Array.isArray(state.votingTallies)
        ?state.votingTallies
        :[];
      const nominees=Array.isArray(state.votingNominees)
        ?state.votingNominees
        :[];

      if(stage==="collecting"){
        const completed=Object.keys(state.votingBallots||{}).length;
        const maxVotes=Math.max(
          1,
          ...tallies.map(item=>Number(item.votes)||0)
        );

        content.innerHTML=`
          <div class="live-vote-title">عملية التصويت</div>
          <div class="live-vote-progress">
            تم التصويت: ${completed} من ${voters.length}
          </div>
          <div class="live-tally-list">
            ${tallies
              .filter(item=>Number(item.votes)>0)
              .map(item=>{
                const votes=Math.max(0,Number(item.votes)||0);
                return `
                  <div class="live-tally-row">
                    <div class="live-tally-seat">
                      اللاعب ${item.seat}
                    </div>
                    <div class="live-tally-votes">${votes}</div>
                  </div>`;
              }).join("")||`
                <div
                  class="live-vote-subtitle"
                  style="grid-column:1/-1;padding:34px 0 12px"
                >
                  بانتظار تسجيل أول صوت…
                </div>`}
          </div>`;
        return;
      }

      if(stage==="nominees"){
        const maxVotes=Math.max(
          0,
          ...tallies.map(item=>Number(item.votes)||0)
        );

        content.innerHTML=`
          <div class="live-vote-title">المتهمون للتبرير</div>
          <div class="live-vote-subtitle" style="margin-top:12px">
            أصحاب أعلى عدد من الأصوات
          </div>
          <div class="live-nominees">
            ${nominees.map(seat=>`
              <div class="live-nominee">
                <span>اللاعب</span>
                <strong>${seat}</strong>
                <span>${maxVotes} صوت</span>
              </div>
            `).join("")}
          </div>`;
        return;
      }
      if(stage==="defense"){
        const index=Math.max(
          0,
          Number(state.votingDefenseIndex)||0
        );
        const seat=Number(nominees[index])||"—";
        const remMs=Math.max(0,remaining());
        const durationMs=Math.max(1000,Number(state.timerDurationMs)||60000);
        const isWarn=remMs<=warningThreshold()||state.timerStatus==="finished";
        const ratio=Math.max(0,Math.min(1,remMs/durationMs));
        const dashOffset=RING_CIRCUMFERENCE*(1-ratio);

        content.innerHTML=`
          <div class="live-defense-layout">
            <section class="live-defense-timer-stage ${isWarn?"warning":""}">
              <div class="timer-wrap">
                <svg class="timer-svg" viewBox="0 0 640 640" aria-hidden="true">
                  <circle class="ring-track" cx="320" cy="320" r="270"></circle>
                  <circle class="ring-progress" cx="320" cy="320" r="270" style="stroke-dasharray:${RING_CIRCUMFERENCE};stroke-dashoffset:${dashOffset}"></circle>
                  <circle class="ring-inner" cx="320" cy="320" r="234"></circle>
                </svg>
                <div class="timer-readout ${isWarn?"warning":""}">${formatSeconds(authoritativeDisplaySeconds())}</div>
              </div>
            </section>
            <section class="live-defense-info">
              <div class="live-defense-player-card">
                <div class="live-defense-player-label">تبرير لاعب رقم</div>
                <div class="live-defense-player-value">${seat}</div>
                <div class="live-defense-player-note">المتهم ${index+1} من ${nominees.length}</div>
              </div>
            </section>
          </div>`;
        return;
      }

      if(stage==="exit"){
        const eligible=Math.max(
          0,
          Number(state.votingEligibleCount)||0
        );
        const threshold=Math.max(
          0,
          Number(state.votingThreshold)||0
        );

        content.innerHTML=`
          <div class="live-vote-title">تصويت الخروج</div>
          <div class="live-vote-subtitle">
            المصوتون المؤهلون: ${eligible}
            — الحد المطلوب: ${threshold}
          </div>
          <div class="live-exit-grid">
            ${nominees.map(seat=>{
              const outVotes=Math.max(
                0,
                Number(
                  (state.votingExitVotes||{})[String(seat)]
                )||0
              );
              const stayVotes=Math.max(0,eligible-outVotes);

              return `
                <div class="live-exit-card">
                  <div class="seat">اللاعب ${seat}</div>
                  <span class="votes">${outVotes}</span>
                  <div class="meta">
                    يخرج ${outVotes} — يبقى ${stayVotes}
                  </div>
                </div>`;
            }).join("")}
          </div>`;
        return;
      }

      if(stage==="result"){
        content.innerHTML=`
          <div class="live-vote-title">نتيجة التصويت</div>
          <div class="live-result-text">
            ${escapeVotingHtml(
              state.votingResultText||
              "جاري إعلان النتيجة"
            )}
          </div>`;
      }
    }

    function render(){
      if(!state)return;

      const phase=PHASE_LABELS[state.phase]
        ?state.phase
        :"idle";

      const liveVoting=
        phase==="voting" &&
        state.votingMode==="live" &&
        !["choice","manual"].includes(state.votingStage);

      const defenseMode =
        phase==="voting" && state.votingStage==="defense";

      document.body.className=
        `phase-${phase}${liveVoting?" voting-live":""}${defenseMode?" voting-defense":""}`;
      $("phaseTitle").textContent=
        defenseMode?"جولة التبرير":PHASE_LABELS[phase];
      $("roundBadge").textContent=String(
        Math.max(1,Number(state.roundNumber)||1)
      );

      const speakerSeat=Math.max(
        0,
        Number(state.speakerSeat)||0
      );

      $("speakerValue").textContent=String(
        speakerSeat||"—"
      );

      const mutedTurn=
        phase==="discussion" &&
        speakerSeat>0 &&
        Number(state.mutedSeat)===speakerSeat;

      const rem=remaining();
      const raw=state.timerStatus||"idle";
      const status=
        raw==="running"&&rem<=0
          ?"finished"
          :raw;

      const warning=
        !mutedTurn &&
        status==="running" &&
        rem>0 &&
        rem<=warningThreshold();

      $("timer").textContent=formatSeconds(
        authoritativeDisplaySeconds()
      );

      $("timer").classList.toggle(
        "warning",
        !mutedTurn&&(warning||status==="finished")
      );

      $("timerStage").classList.toggle(
        "warning",
        !mutedTurn&&(warning||status==="finished")
      );

      $("timerStage").classList.toggle(
        "muted",
        mutedTurn
      );

      if(mutedTurn){
        updateRing(
          state.timerDurationMs,
          state.timerDurationMs,
          false
        );
      }else{
        updateRing(
          rem,
          state.timerDurationMs,
          warning||status==="finished"
        );
      }

      $("aliveCount").textContent=String(
        Math.max(0,Number(state.totalAlive)||0)
      );
      $("mafiaCount").textContent=String(
        Math.max(0,Number(state.mafiaAlive)||0)
      );
      $("citizenCount").textContent=String(
        Math.max(0,Number(state.citizenAlive)||0)
      );
      $("killerCount").textContent=String(
        Math.max(0,Number(state.killerAlive)||0)
      );

      renderLiveVoting();
    }

    function send(event,payload={}){if(mode==="supabase"&&channel){channel.send({type:"broadcast",event,payload}).catch(()=>{});return}if(localChannel){try{localChannel.postMessage({event,payload})}catch(_){}}if(event==="display_request")requestLocalState();if(event==="display_ping")announcePresence()}
    function setDebug(text,type=""){const e=$("debugStatus");if(!e)return;e.textContent=text||"";e.className=`debug-status${type?` ${type}`:""}`}
    function readableRealtimeError(status,error){return [status||"UNKNOWN",error?.message||"",error?.name||"",error?.cause?.message||""].filter(Boolean).join(" — ")||"Realtime connection failed"}
    function scheduleReconnect(){clearTimeout(retryTimer);retryTimer=setTimeout(()=>{if(room)connect()},3000)}
    function showDisplay(){$("pairScreen").style.display="none";$("displayScreen").classList.add("active");fitStage()}
    function connect(){room=$("roomInput").value.trim().toUpperCase().replace(/[^A-Z2-9]/g,"");if(room.length<6){$("pairMessage").textContent="أدخل رمز الجلسة الظاهر في لوحة المنظم.";return}localStorage.setItem("ammanMafiaDisplayLastRoom",room);$("pairMessage").textContent="جاري الاتصال...";transportConnected=false;setConnection(false);try{if(localChannel)localChannel.close()}catch(_){}localChannel=null;clearInterval(ping);clearInterval(syncPoll);clearTimeout(retryTimer);
      if(configured()&&window.supabase&&typeof window.supabase.createClient==="function"){
        mode="supabase";const c=window.AMMAN_MAFIA_REALTIME;client=window.supabase.createClient(c.supabaseUrl.trim(),c.supabaseAnonKey.trim(),{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false},realtime:{params:{eventsPerSecond:10}}});channel=client.channel(`amman-mafia-display-${room}`,{config:{private:false,broadcast:{self:false,ack:true}}});setDebug("Connecting to Supabase Realtime…");channel.on("broadcast",{event:"state"},({payload})=>{setDebug("Realtime state received","ok");apply(payload)}).subscribe((status,error)=>{setDebug(`Realtime status: ${status}`);if(status==="SUBSCRIBED"){clearTimeout(retryTimer);transportConnected=true;lastStateAt=Date.now();setConnection(true);setDebug("Realtime connected","ok");showDisplay();send("display_request",{at:Date.now()})}else if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"||status==="CLOSED"){transportConnected=false;setConnection(false);setDebug(readableRealtimeError(status,error),"error");$("pairMessage").textContent="تعذر ربط شاشة العرض. تحقق من الإنترنت وإعدادات Supabase.";scheduleReconnect()}})
      }else{mode="local";if("BroadcastChannel" in window){localChannel=new BroadcastChannel(`amman-mafia-display-${room}`);localChannel.onmessage=e=>{const d=e.data||{};if(d.event==="state")apply(d.payload)}}transportConnected=true;lastStateAt=Date.now();pullLocalState(true);showDisplay();setConnection(true);announcePresence();requestLocalState();send("display_request",{at:Date.now()});$("pairMessage").textContent="وضع محلي — متصل بلوحة المنظم في تبويب آخر.";syncPoll=setInterval(()=>{pullLocalState(false);announcePresence()},500)}
      ping=setInterval(()=>{send("display_ping",{at:Date.now()});if(mode==="local"){pullLocalState(false);announcePresence()}},2000)
    }
    $("connectBtn").addEventListener("click",connect);$("roomInput").addEventListener("keydown",e=>{if(e.key==="Enter")connect()});$("fullscreenBtn").addEventListener("click",()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()});window.addEventListener("storage",handleStorageEvent);
    const params=new URLSearchParams(location.search);const initialRoom=(params.get("room")||localStorage.getItem("ammanMafiaDisplayLastRoom")||"").toUpperCase();$("roomInput").value=initialRoom;
    if(params.get("preview")==="1"){room="PREVIEW";transportConnected=true;lastStateAt=Date.now();showDisplay();setConnection(true);apply({roomCode:"PREVIEW",phase:"discussion",roundNumber:1,speakerVisible:true,speakerSeat:10,mutedSeat:10,timerDurationMs:30000,timerRemainingMs:30000,timerDisplaySeconds:30,timerStatus:"paused",timerEndsAt:0,totalAlive:26,citizenAlive:14,mafiaAlive:11,killerAlive:1})}else if(params.get("room")){connect()}
    tick=setInterval(()=>{render();updateConnection()},250);fitStage();
  })();
  </script>

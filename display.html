<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05070b">
  <title>Amman Mafia — شاشة العرض v51</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --gold:#dcc166;
      --cream:#f6eedc;
      --blue:#54bdff;
      --red:#ff5963;
      --purple:#b29aff;
      --orange:#ff9f52;
      --panel:rgba(7,15,28,.72);
      --safe-x:clamp(44px,4.7vw,96px);
      --safe-y:clamp(18px,2.4vh,34px);
      --gap:clamp(8px,1.15vh,16px);
    }

    *{box-sizing:border-box}

    html,body{
      width:100%;
      height:100%;
      min-height:0;
      margin:0;
      overflow:hidden;
      background:#05070b;
      color:var(--cream);
      font-family:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;
    }

    body{
      background:
        radial-gradient(circle at 50% 12%,rgba(38,125,211,.34),transparent 44%),
        linear-gradient(180deg,#071a31 0%,#04070d 78%);
    }

    body.phase-voting{
      background:
        radial-gradient(circle at 50% 16%,rgba(202,163,59,.28),transparent 46%),
        linear-gradient(180deg,#181205 0%,#070602 80%);
    }

    body.phase-night{
      background:
        radial-gradient(circle at 50% 18%,rgba(98,72,167,.32),transparent 46%),
        linear-gradient(180deg,#080617 0%,#020204 82%);
    }

    button,input{font:inherit}

    .pair-screen{
      min-height:100dvh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .pair-card{
      width:min(94vw,620px);
      padding:34px;
      text-align:center;
      border-radius:26px;
      border:1px solid rgba(220,193,102,.32);
      background:rgba(9,10,16,.96);
      box-shadow:0 30px 90px rgba(0,0,0,.55);
    }

    .pair-logo{
      width:116px;
      height:116px;
      object-fit:cover;
      border-radius:24px;
      border:1px solid rgba(220,193,102,.46);
    }

    .pair-brand{
      margin-top:16px;
      color:var(--gold);
      font-size:clamp(1.8rem,4vw,2.5rem);
      font-weight:900;
      letter-spacing:4px;
    }

    .pair-sub{
      margin:8px 0 24px;
      color:#9ba0aa;
      font-weight:700;
    }

    .pair-row{
      display:flex;
      gap:10px;
      direction:ltr;
    }

    .pair-row input{
      flex:1;
      min-width:0;
      padding:15px;
      text-align:center;
      text-transform:uppercase;
      letter-spacing:4px;
      color:var(--cream);
      font-weight:900;
      border-radius:13px;
      border:1px solid rgba(255,255,255,.12);
      background:#07090e;
    }

    .pair-row button{
      padding:13px 22px;
      border:0;
      border-radius:13px;
      background:var(--gold);
      color:#08080a;
      font-weight:900;
      cursor:pointer;
    }

    .pair-msg{
      min-height:24px;
      margin-top:14px;
      color:#c9bf9a;
      font-size:.88rem;
    }

    .debug-status{
      margin-top:8px;
      color:#777d89;
      direction:ltr;
      text-align:center;
      font-size:.72rem;
      overflow-wrap:anywhere;
    }

    .debug-status.error{color:#ff747a}
    .debug-status.ok{color:#68dc8a}

    .display{
      display:none;
      width:100%;
      height:100dvh;
      min-height:0;
      overflow:hidden;
    }

    .display.active{
      display:block;
      padding:var(--safe-y) var(--safe-x);
    }

    .stage{
      width:100%;
      height:100%;
      min-height:0;
      display:grid;
      grid-template-rows:auto auto minmax(0,1fr) auto;
      gap:var(--gap);
      align-items:stretch;
      overflow:hidden;
    }

    .phase-area{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:clamp(5px,.65vh,9px);
      min-height:0;
      padding-top:2px;
    }

    .round{
      padding:clamp(5px,.7vh,9px) clamp(18px,1.8vw,30px);
      color:var(--gold);
      font-size:clamp(.9rem,1.75vh,1.2rem);
      font-weight:900;
      border-radius:999px;
      border:1px solid rgba(220,193,102,.42);
      background:rgba(220,193,102,.09);
      white-space:nowrap;
    }

    .phase-row{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:clamp(14px,1.7vw,28px);
    }

    .phase-icon{
      font-size:clamp(3.2rem,7.5vh,5.8rem);
      line-height:1;
      filter:drop-shadow(0 12px 30px rgba(0,0,0,.35));
    }

    .phase{
      font-size:clamp(3.6rem,8.8vh,6.8rem);
      line-height:.92;
      font-weight:900;
      letter-spacing:-.025em;
      text-shadow:0 10px 34px rgba(0,0,0,.35);
    }

    .phase.discussion{color:var(--blue)}
    .phase.voting{color:var(--gold)}
    .phase.night{color:var(--purple)}

    .speaker-card{
      min-height:clamp(92px,13.5vh,148px);
      display:flex;
      align-items:center;
      justify-content:center;
      gap:clamp(20px,2.2vw,38px);
      padding:clamp(10px,1.45vh,20px) clamp(28px,3vw,54px);
      border-radius:clamp(22px,2.1vw,34px);
      border:2px solid rgba(84,189,255,.58);
      background:
        radial-gradient(circle at 20% 0%,rgba(40,160,241,.19),transparent 38%),
        linear-gradient(145deg,rgba(12,45,75,.78),rgba(6,14,26,.84));
      box-shadow:0 18px 58px rgba(0,0,0,.28);
    }

    .speaker-card[hidden]{display:none!important}

    .speaker-mic{
      width:clamp(68px,8.8vh,104px);
      height:clamp(68px,8.8vh,104px);
      display:grid;
      place-items:center;
      flex:0 0 auto;
      border-radius:50%;
      font-size:clamp(2.3rem,5.2vh,4.1rem);
      background:rgba(84,189,255,.13);
      border:1px solid rgba(84,189,255,.46);
    }

    .speaker-seat{
      color:#91d5ff;
      font-size:clamp(3.4rem,8.2vh,6.3rem);
      line-height:.88;
      font-weight:900;
      text-shadow:0 0 30px rgba(67,175,245,.20);
    }

    .timer-panel{
      min-height:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:clamp(8px,1vh,16px) clamp(22px,2.7vw,48px);
      border-radius:clamp(24px,2.4vw,38px);
      border:2px solid rgba(82,151,219,.44);
      background:
        radial-gradient(circle at 50% 8%,rgba(64,132,205,.13),transparent 56%),
        rgba(7,15,29,.68);
      box-shadow:0 22px 64px rgba(0,0,0,.24);
    }

    .timer{
      direction:ltr;
      font-family:"Arial Black","Segoe UI",Arial,sans-serif;
      font-variant-numeric:tabular-nums;
      color:var(--cream);
      font-size:clamp(12rem,34vh,25rem);
      line-height:.72;
      font-weight:950;
      letter-spacing:-.06em;
      text-shadow:0 0 48px rgba(220,193,102,.10);
      white-space:nowrap;
    }

    .timer.running{color:var(--gold)}
    .timer.finished{color:var(--red)}

    .timer.warning{
      color:#ff515b;
      text-shadow:
        0 0 18px rgba(255,81,91,.72),
        0 0 60px rgba(255,42,59,.35);
      animation:warningPulse .72s ease-in-out infinite;
    }

    @keyframes warningPulse{
      0%,100%{transform:scale(1)}
      50%{transform:scale(1.035)}
    }

    .stats{
      min-height:clamp(92px,13vh,138px);
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:clamp(9px,1vw,16px);
    }

    .stats:has(.stat.killer:not([hidden])){
      grid-template-columns:repeat(4,minmax(0,1fr));
    }

    .stat{
      min-width:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:clamp(3px,.5vh,7px);
      padding:8px 10px;
      border-radius:clamp(16px,1.7vw,25px);
      background:rgba(9,18,32,.78);
      border:2px solid rgba(255,255,255,.12);
    }

    .stat-label{
      color:#a7abb4;
      font-size:clamp(.85rem,1.55vh,1.08rem);
      font-weight:800;
    }

    .stat strong{
      font-family:"Arial Black","Segoe UI",Arial,sans-serif;
      font-size:clamp(3.1rem,7.2vh,5.4rem);
      line-height:.86;
      font-weight:950;
    }

    .stat.total{border-color:rgba(220,193,102,.58)}
    .stat.total strong{color:#e5cc70}
    .stat.citizen{border-color:rgba(84,189,255,.58)}
    .stat.citizen strong{color:#6bc6ff}
    .stat.mafia{border-color:rgba(255,89,99,.58)}
    .stat.mafia strong{color:#ff6871}
    .stat.killer{border-color:rgba(255,159,82,.65)}
    .stat.killer strong{color:#ffad68}

    .night-panel{
      display:none;
      min-height:0;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:clamp(18px,2.4vh,34px);
      text-align:center;
    }

    .night-moon{
      width:clamp(210px,31vh,360px);
      height:clamp(210px,31vh,360px);
      border-radius:50%;
      background:
        radial-gradient(circle at 35% 30%,#f0ebff 0 7%,#b7a8ec 29%,#7461b8 60%,#3b2c68 100%);
      box-shadow:
        0 0 70px rgba(143,115,221,.42),
        0 0 180px rgba(91,68,159,.20);
    }

    .night-title{
      color:#c9b9f6;
      font-size:clamp(5.4rem,13vh,10rem);
      line-height:.88;
      font-weight:900;
      text-shadow:0 0 45px rgba(143,115,221,.24);
    }

    .fullscreen-btn{
      position:fixed;
      left:var(--safe-x);
      bottom:max(10px,calc(var(--safe-y) - 6px));
      z-index:20;
      padding:8px 12px;
      color:#b3b6bd;
      font-size:.72rem;
      font-weight:800;
      border-radius:11px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(9,12,18,.64);
      opacity:.35;
      cursor:pointer;
    }

    .fullscreen-btn:hover{opacity:1}

    body.phase-voting .stage{
      grid-template-rows:minmax(0,1fr) auto;
    }

    body.phase-voting .phase-area{
      min-height:0;
      justify-content:center;
    }

    body.phase-voting .speaker-card,
    body.phase-voting .timer-panel{
      display:none!important;
    }

    body.phase-voting .phase-icon{
      font-size:clamp(8rem,18vh,13rem);
    }

    body.phase-voting .phase{
      font-size:clamp(7rem,16vh,12rem);
    }

    body.phase-night .stage{
      display:flex;
      align-items:stretch;
    }

    body.phase-night .phase-area,
    body.phase-night .speaker-card,
    body.phase-night .timer-panel,
    body.phase-night .stats{
      display:none!important;
    }

    body.phase-night .night-panel{
      display:flex;
      flex:1 1 auto;
    }

    @media (min-width:900px) and (max-height:720px){
      :root{
        --safe-x:clamp(42px,4.3vw,82px);
        --safe-y:9px;
        --gap:6px;
      }

      .stage{
        grid-template-rows:auto auto minmax(0,1fr) auto;
      }

      .round{
        padding:4px 14px;
        font-size:.78rem;
      }

      .phase-icon{font-size:2.8rem}
      .phase{font-size:3.3rem}

      .speaker-card{
        min-height:76px;
        padding:7px 24px;
      }

      .speaker-mic{
        width:54px;
        height:54px;
        font-size:1.9rem;
      }

      .speaker-seat{font-size:2.9rem}

      .timer{font-size:clamp(9rem,26vh,14rem)}

      .stats{min-height:76px}
      .stat-label{font-size:.72rem}
      .stat strong{font-size:2.35rem}

      .night-moon{
        width:170px;
        height:170px;
      }

      .night-title{font-size:4.7rem}
    }

    @media (max-width:800px){
      :root{--safe-x:14px}
      .phase{font-size:clamp(2.4rem,9vw,4.2rem)}
      .timer{font-size:clamp(6.5rem,27vw,11rem)}
      .stats,.stats:has(.stat.killer:not([hidden])){
        grid-template-columns:repeat(2,minmax(0,1fr));
      }
    }

    @media (prefers-reduced-motion:reduce){
      .timer.warning{animation:none}
    }
  </style>
</head>
<body>
  <section id="pairScreen" class="pair-screen">
    <div class="pair-card">
      <img class="pair-logo" src="app-icon-master.png" alt="Amman Mafia">
      <div class="pair-brand">AMMAN MAFIA</div>
      <div class="pair-sub">شاشة اللاعبين</div>

      <div class="pair-row">
        <input id="roomInput" maxlength="14" placeholder="رمز الجلسة" autocomplete="off">
        <button id="connectBtn" type="button">اتصال</button>
      </div>

      <div id="pairMessage" class="pair-msg"></div>
      <div id="debugStatus" class="debug-status"></div>
    </div>
  </section>

  <main id="displayScreen" class="display">
    <section class="stage">
      <section class="phase-area">
        <div id="round" class="round">الجولة 1</div>

        <div class="phase-row">
          <div id="phaseIcon" class="phase-icon">⌛</div>
          <div id="phase" class="phase">بانتظار بدء الجولة</div>
        </div>
      </section>

      <section id="speakerCard" class="speaker-card" hidden>
        <div class="speaker-mic">🎙️</div>
        <div id="speakerSeatText" class="speaker-seat">لاعب —</div>
      </section>

      <section class="timer-panel">
        <div id="timer" class="timer">01:00</div>
      </section>

      <section class="night-panel" aria-label="جولة الليل">
        <div class="night-moon"></div>
        <div class="night-title">جولة الليل</div>
      </section>

      <section class="stats" aria-label="أعداد اللاعبين الأحياء">
        <div class="stat total">
          <span class="stat-label">الأحياء</span>
          <strong id="aliveCount">0</strong>
        </div>

        <div class="stat citizen">
          <span class="stat-label">مواطن</span>
          <strong id="citizenCount">0</strong>
        </div>

        <div class="stat mafia">
          <span class="stat-label">مافيا</span>
          <strong id="mafiaCount">0</strong>
        </div>

        <div id="killerStat" class="stat killer" hidden>
          <span class="stat-label">سفاح</span>
          <strong id="killerCount">0</strong>
        </div>
      </section>
    </section>

    <button id="fullscreenBtn" class="fullscreen-btn" type="button">ملء الشاشة ⛶</button>
  </main>

  <script>
    (() => {
      try {
        if ("caches" in window) {
          caches.keys().then(keys => {
            keys
              .filter(key =>
                key.startsWith("amman-mafia-tv-") &&
                key !== "amman-mafia-tv-v51-cache-v1"
              )
              .forEach(key => caches.delete(key));
          });
        }
      } catch (_) {}
    })();
  </script>

  <script src="realtime-config.js?v=51"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>

  <script>
  (function(){
    "use strict";

    const PHASE_LABELS = {
      idle: "بانتظار بدء الجولة",
      discussion: "جولة النقاش",
      voting: "جولة التصويت",
      night: "جولة الليل"
    };

    const PHASE_ICONS = {
      idle: "⌛",
      discussion: "💬",
      voting: "🗳️",
      night: "🌙"
    };

    let room = "";
    let state = null;
    let client = null;
    let channel = null;
    let localChannel = null;
    let mode = "local";
    let lastStateAt = 0;
    let tick = null;
    let ping = null;
    let syncPoll = null;
    let retryTimer = null;
    let lastLocalWrittenAt = 0;

    const LOCAL_STATE_PREFIX = "ammanMafiaLocalDisplayStateV2:";
    const LOCAL_REQUEST_PREFIX = "ammanMafiaLocalDisplayRequestV2:";
    const LOCAL_PRESENCE_PREFIX = "ammanMafiaLocalDisplayPresenceV2:";
    const $ = id => document.getElementById(id);

    function configured(){
      const config = window.AMMAN_MAFIA_REALTIME || {};
      return (
        /^https:\/\/.+\.supabase\.co\/?$/i.test(String(config.supabaseUrl || "").trim()) &&
        String(config.supabaseAnonKey || "").trim().length > 40 &&
        !String(config.supabaseAnonKey).includes("PUT_YOUR_")
      );
    }

    function getTickThresholdMs(){
      if(!state) return 5000;

      const durationSec = Math.round(
        Math.max(0, Number(state.timerDurationMs) || 0) / 1000
      );

      if(durationSec === 60) return 15000;
      if(durationSec === 45) return 10000;
      if(durationSec === 30) return 5000;

      return durationSec >= 60
        ? 15000
        : (durationSec > 30 ? 10000 : 5000);
    }

    function remaining(){
      if(!state) return 0;

      if(state.timerStatus === "running"){
        return Math.max(
          0,
          Number(state.timerEndsAt || 0) - Date.now()
        );
      }

      return Math.max(
        0,
        Number(state.timerRemainingMs || 0)
      );
    }

    function formatTime(ms){
      const total = Math.max(0, Math.ceil(ms / 1000));
      const minutes = Math.floor(total / 60);
      const seconds = total % 60;

      return `${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;
    }

    function apply(payload){
      if(!payload || typeof payload !== "object") return;
      if(payload.roomCode && room && String(payload.roomCode) !== room) return;

      state = {
        ...payload,
        timerEndsAt: Number(payload.timerEndsAt) || 0,
        timerRemainingMs: Math.max(0, Number(payload.timerRemainingMs) || 0),
        timerDurationMs: Math.max(1000, Number(payload.timerDurationMs) || 60000)
      };

      lastStateAt = Date.now();
      render();
    }

    function localStateKey(){ return LOCAL_STATE_PREFIX + room; }
    function localRequestKey(){ return LOCAL_REQUEST_PREFIX + room; }
    function localPresenceKey(){ return LOCAL_PRESENCE_PREFIX + room; }

    function writeLocalSignal(key,payload){
      try{
        localStorage.setItem(
          key,
          JSON.stringify({
            ...payload,
            at: Date.now(),
            nonce: Math.random().toString(36).slice(2)
          })
        );
      }catch(_){}
    }

    function announcePresence(){
      if(!room) return;
      writeLocalSignal(localPresenceKey(), {type:"display-presence"});
    }

    function requestLocalState(){
      if(!room) return;
      writeLocalSignal(localRequestKey(), {type:"display-request"});
    }

    function pullLocalState(force=false){
      if(!room) return false;

      try{
        const envelope = JSON.parse(
          localStorage.getItem(localStateKey()) || "null"
        );

        if(!envelope || !envelope.payload) return false;

        const writtenAt = Number(envelope.writtenAt) || 0;
        if(!force && writtenAt <= lastLocalWrittenAt) return false;

        lastLocalWrittenAt = writtenAt;
        apply(envelope.payload);
        return true;
      }catch(_){
        return false;
      }
    }

    function handleStorageEvent(event){
      if(!room || !event || event.key !== localStateKey()) return;
      pullLocalState(true);
    }

    function render(){
      if(!state) return;

      const phase = PHASE_LABELS[state.phase]
        ? state.phase
        : "idle";

      document.body.classList.toggle("phase-voting", phase === "voting");
      document.body.classList.toggle("phase-night", phase === "night");

      $("round").textContent =
        `الجولة ${Math.max(1, Number(state.roundNumber) || 1)}`;

      $("phase").textContent = PHASE_LABELS[phase];
      $("phase").className = `phase ${phase}`;
      $("phaseIcon").textContent = PHASE_ICONS[phase] || PHASE_ICONS.idle;

      const speakerSeat = Math.max(0, Number(state.speakerSeat) || 0);
      const speakerVisible =
        Boolean(state.speakerVisible) &&
        speakerSeat > 0 &&
        phase === "discussion";

      $("speakerCard").hidden = !speakerVisible;

      if(speakerVisible){
        $("speakerSeatText").textContent = `لاعب ${speakerSeat}`;
      }

      const rem = remaining();
      const rawTimerStatus = state.timerStatus || "idle";
      const timerStatus =
        rawTimerStatus === "running" && rem <= 0
          ? "finished"
          : rawTimerStatus;

      const warning =
        timerStatus === "running" &&
        rem > 0 &&
        rem <= getTickThresholdMs();

      const timer = $("timer");
      timer.textContent = formatTime(rem);
      timer.className =
        `timer ${timerStatus}${warning ? " warning" : ""}`;

      $("aliveCount").textContent =
        String(Math.max(0, Number(state.totalAlive) || 0));

      $("citizenCount").textContent =
        String(Math.max(0, Number(state.citizenAlive) || 0));

      $("mafiaCount").textContent =
        String(Math.max(0, Number(state.mafiaAlive) || 0));

      $("killerCount").textContent =
        String(Math.max(0, Number(state.killerAlive) || 0));

      $("killerStat").hidden = !Boolean(state.showKiller);
    }

    function send(event,payload={}){
      if(mode === "supabase" && channel){
        channel
          .send({type:"broadcast",event,payload})
          .catch(() => {});
        return;
      }

      if(localChannel){
        try{
          localChannel.postMessage({event,payload});
        }catch(_){}
      }

      if(event === "display_request") requestLocalState();
      if(event === "display_ping") announcePresence();
    }

    function setDebug(text,type=""){
      const element = $("debugStatus");
      if(!element) return;

      element.textContent = text || "";
      element.className =
        `debug-status${type ? ` ${type}` : ""}`;
    }

    function readableRealtimeError(status,error){
      return [
        status || "UNKNOWN",
        error?.message || "",
        error?.name || "",
        error?.cause?.message || ""
      ].filter(Boolean).join(" — ") || "Realtime connection failed";
    }

    function scheduleReconnect(){
      clearTimeout(retryTimer);
      retryTimer = setTimeout(() => {
        if(room) connect();
      },3000);
    }

    function showDisplay(){
      $("pairScreen").style.display = "none";
      $("displayScreen").classList.add("active");
    }

    function connect(){
      room = $("roomInput")
        .value
        .trim()
        .toUpperCase()
        .replace(/[^A-Z2-9]/g,"");

      if(room.length < 6){
        $("pairMessage").textContent =
          "أدخل رمز الجلسة الظاهر في لوحة المنظم.";
        return;
      }

      localStorage.setItem("ammanMafiaDisplayLastRoom",room);
      $("pairMessage").textContent = "جاري الاتصال...";

      try{
        if(localChannel) localChannel.close();
      }catch(_){}

      localChannel = null;
      clearInterval(ping);
      clearInterval(syncPoll);
      clearTimeout(retryTimer);

      if(
        configured() &&
        window.supabase &&
        typeof window.supabase.createClient === "function"
      ){
        mode = "supabase";
        const config = window.AMMAN_MAFIA_REALTIME;

        client = window.supabase.createClient(
          config.supabaseUrl.trim(),
          config.supabaseAnonKey.trim(),
          {
            auth:{
              persistSession:false,
              autoRefreshToken:false,
              detectSessionInUrl:false
            },
            realtime:{
              params:{eventsPerSecond:10}
            }
          }
        );

        channel = client.channel(
          `amman-mafia-display-${room}`,
          {
            config:{
              private:false,
              broadcast:{
                self:false,
                ack:true
              }
            }
          }
        );

        setDebug("Connecting to Supabase Realtime…");

        channel
          .on("broadcast",{event:"state"},({payload}) => {
            setDebug("Realtime state received","ok");
            apply(payload);
          })
          .subscribe((status,error) => {
            setDebug(`Realtime status: ${status}`);

            if(status === "SUBSCRIBED"){
              clearTimeout(retryTimer);
              setDebug("Realtime connected","ok");
              showDisplay();
              send("display_request",{at:Date.now()});
            }else if(
              status === "CHANNEL_ERROR" ||
              status === "TIMED_OUT" ||
              status === "CLOSED"
            ){
              setDebug(
                readableRealtimeError(status,error),
                "error"
              );

              $("pairMessage").textContent =
                "تعذر ربط شاشة العرض. تحقق من الإنترنت وإعدادات Supabase.";

              scheduleReconnect();
            }
          });
      }else{
        mode = "local";

        if("BroadcastChannel" in window){
          localChannel = new BroadcastChannel(
            `amman-mafia-display-${room}`
          );

          localChannel.onmessage = event => {
            const data = event.data || {};
            if(data.event === "state") apply(data.payload);
          };
        }

        pullLocalState(true);
        showDisplay();
        announcePresence();
        requestLocalState();
        send("display_request",{at:Date.now()});

        $("pairMessage").textContent =
          "وضع محلي — متصل بلوحة المنظم في تبويب آخر.";

        syncPoll = setInterval(() => {
          pullLocalState(false);
          announcePresence();
        },500);
      }

      ping = setInterval(() => {
        send("display_ping",{at:Date.now()});

        if(mode === "local"){
          pullLocalState(false);
          announcePresence();
        }
      },2000);
    }

    $("connectBtn").addEventListener("click",connect);

    $("roomInput").addEventListener("keydown",event => {
      if(event.key === "Enter") connect();
    });

    $("fullscreenBtn").addEventListener("click",() => {
      const element = document.documentElement;

      if(!document.fullscreenElement){
        element.requestFullscreen?.();
      }else{
        document.exitFullscreen?.();
      }
    });

    window.addEventListener("storage",handleStorageEvent);

    const params = new URLSearchParams(location.search);
    const initialRoom = (
      params.get("room") ||
      localStorage.getItem("ammanMafiaDisplayLastRoom") ||
      ""
    ).toUpperCase();

    $("roomInput").value = initialRoom;

    if(params.get("room")) connect();

    tick = setInterval(render,250);
  })();
  </script>
</body>
</html>

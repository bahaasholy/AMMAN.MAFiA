<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#030305">
  <title>Amman Mafia — شاشة العرض v53</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --white:#f8f7f3;
      --gold:#ffc948;
      --gold-soft:#dba838;
      --red:#ff252d;
      --blue:#278fe4;
      --purple:#a35ddd;
      --green:#22e978;
      --panel:rgba(2,3,7,.83);
      --safe-x:clamp(48px,4.7vw,100px);
      --safe-y:clamp(20px,2.5vh,38px);
      --gap:clamp(10px,1.3vh,18px);
    }

    *{box-sizing:border-box}

    html,body{
      width:100%;
      height:100%;
      min-height:0;
      margin:0;
      overflow:hidden;
      color:var(--white);
      background:#020204;
      font-family:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      z-index:-3;
      background:
        linear-gradient(rgba(0,0,0,.22),rgba(0,0,0,.36)),
        url("mafia-city-bg.jpg") center/cover no-repeat;
      transform:scale(1.015);
    }

    body::after{
      content:"";
      position:fixed;
      inset:0;
      z-index:-2;
      pointer-events:none;
      background:
        radial-gradient(circle at 50% 36%,rgba(100,11,15,.16),transparent 42%),
        linear-gradient(90deg,rgba(0,0,0,.24),transparent 24%,transparent 76%,rgba(0,0,0,.24)),
        linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.05) 55%,rgba(0,0,0,.28));
    }

    body.phase-voting::after{
      background:
        radial-gradient(circle at 50% 37%,rgba(205,157,36,.18),transparent 43%),
        linear-gradient(90deg,rgba(0,0,0,.28),transparent 28%,transparent 72%,rgba(0,0,0,.28)),
        rgba(0,0,0,.20);
    }

    body.phase-night::after{
      background:
        radial-gradient(circle at 50% 38%,rgba(93,52,159,.24),transparent 44%),
        linear-gradient(90deg,rgba(0,0,0,.28),transparent 28%,transparent 72%,rgba(0,0,0,.28)),
        rgba(0,0,0,.30);
    }

    button,input{font:inherit}

    .pair-screen{
      min-height:100dvh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      background:rgba(0,0,0,.58);
      backdrop-filter:blur(7px);
    }

    .pair-card{
      width:min(94vw,620px);
      padding:34px;
      text-align:center;
      border-radius:26px;
      border:1px solid rgba(255,201,72,.42);
      background:rgba(5,5,8,.94);
      box-shadow:0 30px 90px rgba(0,0,0,.68);
    }

    .pair-logo{
      width:116px;
      height:116px;
      object-fit:cover;
      border-radius:24px;
      border:1px solid rgba(255,201,72,.48);
    }

    .pair-brand{
      margin-top:16px;
      color:var(--gold);
      font-size:clamp(1.8rem,4vw,2.5rem);
      font-weight:900;
      letter-spacing:4px;
    }

    .pair-sub{
      margin:8px 0 24px;
      color:#a7a7ae;
      font-weight:700;
    }

    .pair-row{
      display:flex;
      gap:10px;
      direction:ltr;
    }

    .pair-row input{
      flex:1;
      min-width:0;
      padding:15px;
      text-align:center;
      text-transform:uppercase;
      letter-spacing:4px;
      color:white;
      font-weight:900;
      border-radius:13px;
      border:1px solid rgba(255,255,255,.14);
      background:#09090d;
    }

    .pair-row button{
      padding:13px 22px;
      border:0;
      border-radius:13px;
      color:#080808;
      background:var(--gold);
      font-weight:900;
      cursor:pointer;
    }

    .pair-msg{
      min-height:24px;
      margin-top:14px;
      color:#d2c9b0;
      font-size:.88rem;
    }

    .debug-status{
      margin-top:8px;
      color:#85858d;
      direction:ltr;
      text-align:center;
      font-size:.72rem;
      overflow-wrap:anywhere;
    }

    .debug-status.error{color:#ff747a}
    .debug-status.ok{color:#68dc8a}

    .display{
      display:none;
      width:100%;
      height:100dvh;
      min-height:0;
      overflow:hidden;
    }

    .display.active{
      display:block;
      padding:var(--safe-y) var(--safe-x);
    }

    .stage{
      width:100%;
      height:100%;
      min-height:0;
      display:grid;
      grid-template-rows:auto auto minmax(0,1fr) auto;
      gap:var(--gap);
    }

    /* Exact centred title, independent side controls. */
    .top-bar{
      position:relative;
      min-height:clamp(88px,11.5vh,136px);
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .connection-pill{
      position:absolute;
      left:0;
      top:50%;
      transform:translateY(-50%);
      min-width:clamp(145px,12vw,205px);
      min-height:clamp(52px,6.4vh,70px);
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      padding:8px 20px;
      border-radius:17px;
      color:#ececec;
      font-size:clamp(1.12rem,2.35vh,1.55rem);
      font-weight:800;
      border:2px solid rgba(193,193,193,.40);
      background:rgba(3,4,6,.72);
      box-shadow:inset 0 0 22px rgba(255,255,255,.035);
    }

    .connection-dot{
      width:clamp(16px,2vh,22px);
      height:clamp(16px,2vh,22px);
      border-radius:50%;
      background:#ff4d59;
      box-shadow:0 0 18px rgba(255,77,89,.90);
    }

    .connection-pill.online{
      border-color:rgba(108,181,131,.55);
    }

    .connection-pill.online .connection-dot{
      background:var(--green);
      box-shadow:0 0 20px rgba(34,233,120,.95);
    }

    .phase-title{
      max-width:68%;
      overflow:hidden;
      text-overflow:ellipsis;
      color:var(--white);
      font-size:clamp(4.1rem,9.8vh,7.5rem);
      line-height:.86;
      font-weight:900;
      letter-spacing:-.035em;
      text-align:center;
      white-space:nowrap;
      text-shadow:
        0 4px 16px rgba(0,0,0,.75),
        0 0 26px rgba(255,255,255,.06);
    }

    .round-circle{
      position:absolute;
      right:0;
      top:50%;
      transform:translateY(-50%);
      width:clamp(100px,10.5vh,144px);
      height:clamp(100px,10.5vh,144px);
      display:grid;
      place-items:center;
      border-radius:50%;
      color:var(--gold);
      font-family:"Arial Black","Segoe UI",Arial,sans-serif;
      font-size:clamp(2.65rem,5.7vh,4.2rem);
      font-weight:950;
      border:3px solid var(--gold);
      background:rgba(3,3,5,.76);
      box-shadow:
        0 0 20px rgba(255,201,72,.30),
        inset 0 0 28px rgba(255,201,72,.06);
    }

    .speaker-card{
      min-height:clamp(125px,16.5vh,184px);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:clamp(14px,1.8vh,24px) clamp(26px,3vw,54px);
      border-radius:clamp(25px,2.2vw,36px);
      border:2px solid rgba(255,201,72,.88);
      background:
        linear-gradient(180deg,rgba(2,2,3,.86),rgba(5,4,3,.78));
      box-shadow:
        inset 0 0 32px rgba(255,201,72,.035),
        0 18px 52px rgba(0,0,0,.30);
    }

    .speaker-card[hidden]{display:none!important}

    .speaker-text{
      display:flex;
      align-items:baseline;
      justify-content:center;
      gap:clamp(16px,1.65vw,28px);
      white-space:nowrap;
      line-height:.94;
      font-size:clamp(3.55rem,8vh,6.2rem);
      font-weight:900;
      text-align:center;
    }

    .speaker-prefix{color:var(--white)}

    .speaker-player{
      color:var(--gold);
      text-shadow:0 0 25px rgba(255,201,72,.18);
    }

    .timer-panel{
      --timer-accent:rgba(255,37,45,.72);
      position:relative;
      min-height:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:clamp(8px,1vh,15px) clamp(82px,7vw,132px);
      border-radius:clamp(26px,2.4vw,40px);
      border:2px solid rgba(169,23,29,.72);
      background:
        radial-gradient(circle at 50% 45%,rgba(126,0,5,.18),transparent 61%),
        rgba(5,1,2,.80);
      box-shadow:
        inset 0 0 50px rgba(110,0,4,.11),
        0 22px 66px rgba(0,0,0,.34);
    }

    .timer-panel::before,
    .timer-panel::after{
      position:absolute;
      top:50%;
      transform:translateY(-54%);
      color:var(--timer-accent);
      font-family:Arial,sans-serif;
      font-size:clamp(10rem,25vh,19rem);
      line-height:1;
      font-weight:300;
      text-shadow:0 0 24px rgba(255,37,45,.28);
    }

    .timer-panel::before{
      content:"(";
      left:clamp(20px,2.3vw,45px);
    }

    .timer-panel::after{
      content:")";
      right:clamp(20px,2.3vw,45px);
    }

    .timer{
      direction:ltr;
      font-family:"Arial Black","Segoe UI",Arial,sans-serif;
      font-variant-numeric:tabular-nums;
      color:#fff8ee;
      font-size:clamp(12.5rem,33vh,25rem);
      line-height:.70;
      font-weight:950;
      letter-spacing:-.065em;
      text-shadow:
        0 0 15px rgba(255,255,255,.12),
        0 0 48px rgba(201,54,36,.10);
      white-space:nowrap;
    }

    .timer.running{
      color:#fff4e4;
    }

    .timer.finished,
    .timer.warning{
      color:var(--red);
      text-shadow:
        0 0 18px rgba(255,37,45,.78),
        0 0 64px rgba(255,37,45,.40);
    }

    .timer.warning{
      animation:warningPulse .72s ease-in-out infinite;
    }

    .timer-panel.warning-panel{
      --timer-accent:var(--red);
      border-color:rgba(255,37,45,.88);
      background:
        radial-gradient(circle at 50% 45%,rgba(166,0,7,.24),transparent 61%),
        rgba(7,1,2,.84);
    }

    @keyframes warningPulse{
      0%,100%{transform:scale(1)}
      50%{transform:scale(1.025)}
    }

    .stats{
      min-height:clamp(150px,19.5vh,224px);
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      direction:ltr;
      gap:clamp(11px,1.25vw,20px);
    }

    .stat{
      --accent:#fff;
      min-width:0;
      position:relative;
      display:grid;
      grid-template-columns:minmax(92px,34%) minmax(0,1fr);
      align-items:center;
      direction:ltr;
      gap:10px;
      padding:clamp(12px,1.5vh,20px) clamp(13px,1.35vw,24px);
      border-radius:clamp(23px,2vw,32px);
      border:2px solid var(--accent);
      background:
        radial-gradient(circle at 48% 0%,rgba(255,255,255,.035),transparent 48%),
        rgba(4,4,7,.80);
      box-shadow:
        inset 0 0 28px rgba(255,255,255,.018),
        0 16px 44px rgba(0,0,0,.27);
    }

    .stat-icon{
      width:100%;
      height:clamp(84px,10vh,122px);
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--accent);
      filter:drop-shadow(0 0 11px rgba(255,255,255,.10));
    }

    .stat-icon svg{
      width:78%;
      height:78%;
      fill:currentColor;
      stroke:currentColor;
      stroke-width:1.4;
    }

    .stat-copy{
      min-width:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      direction:rtl;
      gap:3px;
    }

    .stat-label{
      max-width:100%;
      overflow:hidden;
      text-overflow:ellipsis;
      color:var(--white);
      font-size:clamp(1.35rem,2.8vh,2rem);
      line-height:1;
      font-weight:800;
      white-space:nowrap;
    }

    .stat strong{
      color:var(--accent);
      font-family:"Arial Black","Segoe UI",Arial,sans-serif;
      font-size:clamp(4rem,8.3vh,6.4rem);
      line-height:.86;
      font-weight:950;
    }

    .stat-total{--accent:var(--gold)}
    .stat-citizen{--accent:var(--blue)}
    .stat-mafia{--accent:var(--red)}
    .stat-killer{--accent:var(--purple)}

    .phase-panel{
      display:none;
      min-height:0;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:clamp(18px,2.4vh,34px);
      text-align:center;
      border-radius:clamp(28px,2.4vw,40px);
      border:2px solid rgba(255,255,255,.15);
      background:rgba(2,2,5,.72);
      box-shadow:0 20px 64px rgba(0,0,0,.34);
    }

    .large-phase-icon{
      font-size:clamp(9rem,21vh,15rem);
      line-height:1;
      filter:drop-shadow(0 0 35px rgba(255,255,255,.14));
    }

    .large-phase-title{
      font-size:clamp(6.7rem,15vh,11.5rem);
      line-height:.88;
      font-weight:900;
    }

    .night-panel .large-phase-title{color:var(--purple)}
    .voting-panel .large-phase-title{color:var(--gold)}
    .idle-panel .large-phase-title{color:var(--blue)}

    .fullscreen-btn{
      position:fixed;
      left:var(--safe-x);
      bottom:max(10px,calc(var(--safe-y) - 8px));
      z-index:20;
      padding:7px 11px;
      color:#bcbcbc;
      font-size:.68rem;
      font-weight:800;
      border-radius:10px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(3,3,5,.62);
      opacity:.22;
      cursor:pointer;
    }

    .fullscreen-btn:hover{opacity:1}

    body.phase-voting .stage,
    body.phase-night .stage,
    body.phase-idle .stage{
      grid-template-rows:auto minmax(0,1fr) auto;
    }

    body.phase-voting .speaker-card,
    body.phase-voting .timer-panel,
    body.phase-night .speaker-card,
    body.phase-night .timer-panel,
    body.phase-idle .speaker-card,
    body.phase-idle .timer-panel{
      display:none!important;
    }

    body.phase-voting .voting-panel{display:flex}
    body.phase-night .night-panel{display:flex}
    body.phase-idle .idle-panel{display:flex}

    @media (min-width:900px) and (max-height:730px){
      :root{
        --safe-x:clamp(38px,3.8vw,74px);
        --safe-y:9px;
        --gap:7px;
      }

      .top-bar{min-height:70px}
      .connection-pill{
        min-height:44px;
        min-width:128px;
        font-size:1rem;
      }

      .phase-title{font-size:3.8rem}
      .round-circle{
        width:84px;
        height:84px;
        font-size:2.35rem;
      }

      .speaker-card{
        min-height:96px;
        padding:8px 22px;
      }

      .speaker-text{font-size:3.05rem}
      .timer{font-size:clamp(9.7rem,27vh,15.5rem)}
      .timer-panel::before,
      .timer-panel::after{
        font-size:clamp(7.5rem,20vh,12rem);
      }

      .stats{min-height:118px}
      .stat{
        grid-template-columns:minmax(64px,31%) minmax(0,1fr);
        padding:8px 12px;
      }

      .stat-icon{height:75px}
      .stat-label{font-size:1.1rem}
      .stat strong{font-size:3.25rem}
    }

    @media (max-width:950px){
      .phase-title{max-width:58%}
      .connection-pill{min-width:115px}
      .stats{gap:7px}
      .stat{
        grid-template-columns:1fr;
        gap:2px;
      }
      .stat-icon{height:55px}
    }

    @media (prefers-reduced-motion:reduce){
      .timer.warning{animation:none}
    }
  </style>
</head>

    <button id="fullscreenBtn" class="fullscreen-btn" type="button">ملء الشاشة ⛶</button>

  <script>
    (() => {
      try {
        if ("caches" in window) {
          caches.keys().then(keys => {
            keys
              .filter(key =>
                key.startsWith("amman-mafia-tv-") &&
                key !== "amman-mafia-tv-v53-cache-v1"
              )
              .forEach(key => caches.delete(key));
          });
        }
      } catch (_) {}
    })();
  </script>

  <script src="realtime-config.js?v=53"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>

  <script>
  (function(){
    "use strict";

    const PHASE_LABELS = {
      idle: "بانتظار الجولة",
      discussion: "جولة النقاش",
      voting: "جولة التصويت",
      night: "جولة الليل"
    };

    let room = "";
    let state = null;
    let client = null;
    let channel = null;
    let localChannel = null;
    let mode = "local";
    let transportConnected = false;
    let lastStateAt = 0;
    let tick = null;
    let ping = null;
    let syncPoll = null;
    let retryTimer = null;
    let lastLocalWrittenAt = 0;

    const LOCAL_STATE_PREFIX = "ammanMafiaLocalDisplayStateV2:";
    const LOCAL_REQUEST_PREFIX = "ammanMafiaLocalDisplayRequestV2:";
    const LOCAL_PRESENCE_PREFIX = "ammanMafiaLocalDisplayPresenceV2:";
    const $ = id => document.getElementById(id);

    function configured(){
      const config = window.AMMAN_MAFIA_REALTIME || {};
      return (
        /^https:\/\/.+\.supabase\.co\/?$/i.test(String(config.supabaseUrl || "").trim()) &&
        String(config.supabaseAnonKey || "").trim().length > 40 &&
        !String(config.supabaseAnonKey).includes("PUT_YOUR_")
      );
    }

    function getTickThresholdMs(){
      if(!state) return 5000;

      const durationSec = Math.round(
        Math.max(0, Number(state.timerDurationMs) || 0) / 1000
      );

      if(durationSec === 60) return 15000;
      if(durationSec === 45) return 10000;
      if(durationSec === 30) return 5000;

      return durationSec >= 60
        ? 15000
        : (durationSec > 30 ? 10000 : 5000);
    }

    function remaining(){
      if(!state) return 0;

      if(state.timerStatus === "running"){
        return Math.max(
          0,
          Number(state.timerEndsAt || 0) - Date.now()
        );
      }

      return Math.max(
        0,
        Number(state.timerRemainingMs || 0)
      );
    }

    function formatTime(ms){
      const total = Math.max(0, Math.ceil(ms / 1000));
      const minutes = Math.floor(total / 60);
      const seconds = total % 60;

      return `${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;
    }

    function apply(payload){
      if(!payload || typeof payload !== "object") return;
      if(payload.roomCode && room && String(payload.roomCode) !== room) return;

      state = {
        ...payload,
        timerEndsAt: Number(payload.timerEndsAt) || 0,
        timerRemainingMs: Math.max(0, Number(payload.timerRemainingMs) || 0),
        timerDurationMs: Math.max(1000, Number(payload.timerDurationMs) || 60000)
      };

      lastStateAt = Date.now();
      render();
    }

    function localStateKey(){ return LOCAL_STATE_PREFIX + room; }
    function localRequestKey(){ return LOCAL_REQUEST_PREFIX + room; }
    function localPresenceKey(){ return LOCAL_PRESENCE_PREFIX + room; }

    function writeLocalSignal(key,payload){
      try{
        localStorage.setItem(
          key,
          JSON.stringify({
            ...payload,
            at: Date.now(),
            nonce: Math.random().toString(36).slice(2)
          })
        );
      }catch(_){}
    }

    function announcePresence(){
      if(!room) return;
      writeLocalSignal(localPresenceKey(), {type:"display-presence"});
    }

    function requestLocalState(){
      if(!room) return;
      writeLocalSignal(localRequestKey(), {type:"display-request"});
    }

    function pullLocalState(force=false){
      if(!room) return false;

      try{
        const envelope = JSON.parse(
          localStorage.getItem(localStateKey()) || "null"
        );

        if(!envelope || !envelope.payload) return false;

        const writtenAt = Number(envelope.writtenAt) || 0;
        if(!force && writtenAt <= lastLocalWrittenAt) return false;

        lastLocalWrittenAt = writtenAt;
        apply(envelope.payload);
        return true;
      }catch(_){
        return false;
      }
    }

    function handleStorageEvent(event){
      if(!room || !event || event.key !== localStateKey()) return;
      pullLocalState(true);
    }

    function setConnection(isOnline){
      const pill = $("connectionPill");
      pill.classList.toggle("online", Boolean(isOnline));
      $("connectionText").textContent = isOnline ? "متصل" : "غير متصل";
    }

    function updateConnection(){
      const stateFresh = !state || Date.now() - lastStateAt < 22000;
      setConnection(transportConnected && stateFresh);
    }

    function render(){
      if(!state) return;

      const phase = PHASE_LABELS[state.phase]
        ? state.phase
        : "idle";

      document.body.className = `phase-${phase}`;

      $("phaseTitle").textContent = PHASE_LABELS[phase];
      $("roundCircle").textContent =
        String(Math.max(1, Number(state.roundNumber) || 1));

      const speakerSeat = Math.max(0, Number(state.speakerSeat) || 0);
      const speakerVisible =
        Boolean(state.speakerVisible) &&
        speakerSeat > 0 &&
        phase === "discussion";

      $("speakerCard").hidden = !speakerVisible;
      $("speakerPlayerText").textContent =
        speakerVisible
          ? `للاعب رقم ${speakerSeat}`
          : "بانتظار تحديد اللاعب";

      const rem = remaining();
      const rawTimerStatus = state.timerStatus || "idle";
      const timerStatus =
        rawTimerStatus === "running" && rem <= 0
          ? "finished"
          : rawTimerStatus;

      const warning =
        timerStatus === "running" &&
        rem > 0 &&
        rem <= getTickThresholdMs();

      const timer = $("timer");
      timer.textContent = formatTime(rem);
      timer.className =
        `timer ${timerStatus}${warning ? " warning" : ""}`;

      $("timerPanel").classList.toggle("warning-panel", warning);

      $("aliveCount").textContent =
        String(Math.max(0, Number(state.totalAlive) || 0));

      $("citizenCount").textContent =
        String(Math.max(0, Number(state.citizenAlive) || 0));

      $("mafiaCount").textContent =
        String(Math.max(0, Number(state.mafiaAlive) || 0));

      $("killerCount").textContent =
        String(Math.max(0, Number(state.killerAlive) || 0));
    }

    function send(event,payload={}){
      if(mode === "supabase" && channel){
        channel
          .send({type:"broadcast",event,payload})
          .catch(() => {});
        return;
      }

      if(localChannel){
        try{
          localChannel.postMessage({event,payload});
        }catch(_){}
      }

      if(event === "display_request") requestLocalState();
      if(event === "display_ping") announcePresence();
    }

    function setDebug(text,type=""){
      const element = $("debugStatus");
      if(!element) return;

      element.textContent = text || "";
      element.className =
        `debug-status${type ? ` ${type}` : ""}`;
    }

    function readableRealtimeError(status,error){
      return [
        status || "UNKNOWN",
        error?.message || "",
        error?.name || "",
        error?.cause?.message || ""
      ].filter(Boolean).join(" — ") || "Realtime connection failed";
    }

    function scheduleReconnect(){
      clearTimeout(retryTimer);
      retryTimer = setTimeout(() => {
        if(room) connect();
      },3000);
    }

    function showDisplay(){
      $("pairScreen").style.display = "none";
      $("displayScreen").classList.add("active");
    }

    function connect(){
      room = $("roomInput")
        .value
        .trim()
        .toUpperCase()
        .replace(/[^A-Z2-9]/g,"");

      if(room.length < 6){
        $("pairMessage").textContent =
          "أدخل رمز الجلسة الظاهر في لوحة المنظم.";
        return;
      }

      localStorage.setItem("ammanMafiaDisplayLastRoom",room);
      $("pairMessage").textContent = "جاري الاتصال...";
      transportConnected = false;
      setConnection(false);

      try{
        if(localChannel) localChannel.close();
      }catch(_){}

      localChannel = null;
      clearInterval(ping);
      clearInterval(syncPoll);
      clearTimeout(retryTimer);

      if(
        configured() &&
        window.supabase &&
        typeof window.supabase.createClient === "function"
      ){
        mode = "supabase";
        const config = window.AMMAN_MAFIA_REALTIME;

        client = window.supabase.createClient(
          config.supabaseUrl.trim(),
          config.supabaseAnonKey.trim(),
          {
            auth:{
              persistSession:false,
              autoRefreshToken:false,
              detectSessionInUrl:false
            },
            realtime:{
              params:{eventsPerSecond:10}
            }
          }
        );

        channel = client.channel(
          `amman-mafia-display-${room}`,
          {
            config:{
              private:false,
              broadcast:{
                self:false,
                ack:true
              }
            }
          }
        );

        setDebug("Connecting to Supabase Realtime…");

        channel
          .on("broadcast",{event:"state"},({payload}) => {
            setDebug("Realtime state received","ok");
            apply(payload);
          })
          .subscribe((status,error) => {
            setDebug(`Realtime status: ${status}`);

            if(status === "SUBSCRIBED"){
              clearTimeout(retryTimer);
              transportConnected = true;
              lastStateAt = Date.now();
              setConnection(true);
              setDebug("Realtime connected","ok");
              showDisplay();
              send("display_request",{at:Date.now()});
            }else if(
              status === "CHANNEL_ERROR" ||
              status === "TIMED_OUT" ||
              status === "CLOSED"
            ){
              transportConnected = false;
              setConnection(false);
              setDebug(
                readableRealtimeError(status,error),
                "error"
              );

              $("pairMessage").textContent =
                "تعذر ربط شاشة العرض. تحقق من الإنترنت وإعدادات Supabase.";

              scheduleReconnect();
            }
          });
      }else{
        mode = "local";

        if("BroadcastChannel" in window){
          localChannel = new BroadcastChannel(
            `amman-mafia-display-${room}`
          );

          localChannel.onmessage = event => {
            const data = event.data || {};
            if(data.event === "state") apply(data.payload);
          };
        }

        transportConnected = true;
        lastStateAt = Date.now();
        pullLocalState(true);
        showDisplay();
        setConnection(true);
        announcePresence();
        requestLocalState();
        send("display_request",{at:Date.now()});

        $("pairMessage").textContent =
          "وضع محلي — متصل بلوحة المنظم في تبويب آخر.";

        syncPoll = setInterval(() => {
          pullLocalState(false);
          announcePresence();
        },500);
      }

      ping = setInterval(() => {
        send("display_ping",{at:Date.now()});

        if(mode === "local"){
          pullLocalState(false);
          announcePresence();
        }
      },2000);
    }

    $("connectBtn").addEventListener("click",connect);

    $("roomInput").addEventListener("keydown",event => {
      if(event.key === "Enter") connect();
    });

    $("fullscreenBtn").addEventListener("click",() => {
      const element = document.documentElement;

      if(!document.fullscreenElement){
        element.requestFullscreen?.();
      }else{
        document.exitFullscreen?.();
      }
    });

    window.addEventListener("storage",handleStorageEvent);

    const params = new URLSearchParams(location.search);
    const initialRoom = (
      params.get("room") ||
      localStorage.getItem("ammanMafiaDisplayLastRoom") ||
      ""
    ).toUpperCase();

    $("roomInput").value = initialRoom;

    if(params.get("preview") === "1"){
      room = "PREVIEW";
      transportConnected = true;
      lastStateAt = Date.now();
      showDisplay();
      setConnection(true);
      apply({
        roomCode:"PREVIEW",
        phase:"discussion",
        roundNumber:2,
        speakerVisible:true,
        speakerSeat:5,
        timerDurationMs:60000,
        timerRemainingMs:44000,
        timerStatus:"paused",
        timerEndsAt:0,
        totalAlive:11,
        citizenAlive:5,
        mafiaAlive:5,
        killerAlive:1
      });
    }else if(params.get("room")){
      connect();
    }

    tick = setInterval(() => {
      render();
      updateConnection();
    },250);
  })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#030717">
  <title>Amman Mafia — شاشة العرض v52</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#030717;
      --panel:#07133a;
      --panel-2:#081847;
      --white:#f8fbff;
      --cyan:#05d8f4;
      --blue:#1688ff;
      --lime:#cfff24;
      --pink:#ff3ca6;
      --purple:#a65cff;
      --red:#ff395f;
      --yellow:#ffd83d;
      --green:#2bed72;
      --muted:#9da8c6;
      --safe-x:clamp(42px,4.2vw,88px);
      --safe-y:clamp(20px,2.4vh,36px);
      --gap:clamp(10px,1.35vh,18px);
    }

    *{box-sizing:border-box}

    html,body{
      width:100%;
      height:100%;
      min-height:0;
      margin:0;
      overflow:hidden;
      background:var(--bg);
      color:var(--white);
      font-family:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;
    }

    body{
      background:
        radial-gradient(circle at 50% 8%,rgba(14,59,177,.35),transparent 42%),
        linear-gradient(180deg,#020617 0%,#020410 100%);
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        linear-gradient(90deg,rgba(24,90,255,.05) 1px,transparent 1px),
        linear-gradient(rgba(24,90,255,.04) 1px,transparent 1px);
      background-size:70px 70px;
      mask-image:linear-gradient(to bottom,rgba(0,0,0,.35),transparent 85%);
    }

    body.phase-voting{
      background:
        radial-gradient(circle at 50% 12%,rgba(222,178,45,.30),transparent 46%),
        linear-gradient(180deg,#120d02 0%,#050401 100%);
    }

    body.phase-night{
      background:
        radial-gradient(circle at 50% 16%,rgba(101,72,190,.34),transparent 48%),
        linear-gradient(180deg,#08051a 0%,#020205 100%);
    }

    button,input{font:inherit}

    .pair-screen{
      min-height:100dvh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .pair-card{
      width:min(94vw,620px);
      padding:34px;
      text-align:center;
      border-radius:26px;
      border:1px solid rgba(30,139,255,.34);
      background:rgba(4,8,22,.96);
      box-shadow:0 30px 90px rgba(0,0,0,.60);
    }

    .pair-logo{
      width:116px;
      height:116px;
      object-fit:cover;
      border-radius:24px;
      border:1px solid rgba(22,136,255,.55);
    }

    .pair-brand{
      margin-top:16px;
      color:var(--cyan);
      font-size:clamp(1.8rem,4vw,2.5rem);
      font-weight:900;
      letter-spacing:4px;
    }

    .pair-sub{
      margin:8px 0 24px;
      color:var(--muted);
      font-weight:700;
    }

    .pair-row{
      display:flex;
      gap:10px;
      direction:ltr;
    }

    .pair-row input{
      flex:1;
      min-width:0;
      padding:15px;
      text-align:center;
      text-transform:uppercase;
      letter-spacing:4px;
      color:var(--white);
      font-weight:900;
      border-radius:13px;
      border:1px solid rgba(255,255,255,.12);
      background:#04091c;
    }

    .pair-row button{
      padding:13px 22px;
      border:0;
      border-radius:13px;
      background:var(--blue);
      color:white;
      font-weight:900;
      cursor:pointer;
    }

    .pair-msg{
      min-height:24px;
      margin-top:14px;
      color:#c5cde2;
      font-size:.88rem;
    }

    .debug-status{
      margin-top:8px;
      color:#7884a5;
      direction:ltr;
      text-align:center;
      font-size:.72rem;
      overflow-wrap:anywhere;
    }

    .debug-status.error{color:#ff747a}
    .debug-status.ok{color:#68dc8a}

    .display{
      display:none;
      width:100%;
      height:100dvh;
      min-height:0;
      overflow:hidden;
    }

    .display.active{
      display:block;
      padding:var(--safe-y) var(--safe-x);
    }

    .stage{
      width:100%;
      height:100%;
      min-height:0;
      display:grid;
      grid-template-rows:auto auto minmax(0,1fr) auto;
      gap:var(--gap);
      overflow:hidden;
    }

    .top-bar{
      min-height:clamp(78px,10.5vh,124px);
      display:grid;
      grid-template-columns:minmax(150px,1fr) auto minmax(150px,1fr);
      align-items:center;
      gap:20px;
    }

    .connection-pill{
      justify-self:start;
      min-width:clamp(150px,13vw,220px);
      min-height:clamp(52px,6.8vh,72px);
      display:flex;
      align-items:center;
      justify-content:center;
      gap:14px;
      padding:8px 22px;
      border-radius:999px;
      color:#eaf0ff;
      font-size:clamp(1.15rem,2.4vh,1.65rem);
      font-weight:800;
      border:2px solid rgba(22,136,255,.78);
      background:rgba(4,15,47,.78);
      box-shadow:inset 0 0 26px rgba(12,83,222,.14);
    }

    .connection-dot{
      width:clamp(16px,2vh,22px);
      height:clamp(16px,2vh,22px);
      border-radius:50%;
      background:#ff4a59;
      box-shadow:0 0 18px rgba(255,74,89,.85);
    }

    .connection-pill.online{
      border-color:rgba(22,136,255,.95);
    }

    .connection-pill.online .connection-dot{
      background:var(--green);
      box-shadow:0 0 20px rgba(43,237,114,.95);
    }

    .phase-heading{
      justify-self:center;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:clamp(20px,2.5vw,44px);
      white-space:nowrap;
    }

    .phase-title{
      color:var(--white);
      font-size:clamp(4rem,9.8vh,7.5rem);
      line-height:.9;
      font-weight:900;
      letter-spacing:-.035em;
      text-shadow:0 0 34px rgba(255,255,255,.13);
    }

    .round-circle{
      width:clamp(104px,10vh,146px);
      height:clamp(104px,10vh,146px);
      display:grid;
      place-items:center;
      flex:0 0 auto;
      border-radius:50%;
      color:var(--white);
      font-size:clamp(1.65rem,3.4vh,2.4rem);
      font-weight:900;
      line-height:1.15;
      text-align:center;
      border:3px solid var(--cyan);
      background:rgba(3,15,49,.82);
      box-shadow:
        0 0 22px rgba(0,216,244,.65),
        inset 0 0 28px rgba(0,216,244,.08);
    }

    .top-spacer{justify-self:end}

    .speaker-card{
      min-height:clamp(122px,16vh,180px);
      display:flex;
      align-items:center;
      justify-content:center;
      gap:clamp(24px,2.7vw,48px);
      padding:clamp(14px,1.8vh,24px) clamp(28px,3vw,56px);
      border-radius:clamp(24px,2.2vw,36px);
      border:2px solid rgba(40,114,255,.90);
      background:
        radial-gradient(circle at 50% 0%,rgba(16,100,255,.14),transparent 48%),
        linear-gradient(145deg,rgba(4,15,57,.92),rgba(3,10,36,.94));
      box-shadow:
        inset 0 0 42px rgba(22,80,218,.12),
        0 18px 60px rgba(0,0,0,.32);
    }

    .speaker-card[hidden]{display:none!important}

    .speaker-text{
      display:flex;
      align-items:baseline;
      justify-content:center;
      gap:clamp(16px,1.6vw,28px);
      white-space:nowrap;
      line-height:.95;
      font-size:clamp(3.3rem,7.5vh,6rem);
      font-weight:900;
    }

    .speaker-prefix{
      color:var(--white);
    }

    .speaker-player{
      color:var(--cyan);
      text-shadow:0 0 30px rgba(0,216,244,.28);
    }

    .speaker-mic{
      width:clamp(82px,9.7vh,118px);
      height:clamp(82px,9.7vh,118px);
      display:grid;
      place-items:center;
      flex:0 0 auto;
      border-radius:50%;
      color:var(--cyan);
      font-size:clamp(2.8rem,6vh,4.7rem);
      border:2px solid var(--cyan);
      background:rgba(0,216,244,.08);
      box-shadow:
        0 0 24px rgba(0,216,244,.45),
        inset 0 0 20px rgba(0,216,244,.10);
    }

    .timer-panel{
      min-height:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:clamp(10px,1.2vh,18px) clamp(20px,2.6vw,46px);
      border-radius:clamp(26px,2.4vw,40px);
      border:2px solid rgba(40,114,255,.86);
      background:
        radial-gradient(circle at 50% 15%,rgba(28,90,255,.13),transparent 60%),
        linear-gradient(145deg,rgba(3,13,49,.93),rgba(2,8,29,.95));
      box-shadow:
        inset 0 0 50px rgba(14,66,209,.10),
        0 22px 66px rgba(0,0,0,.32);
    }

    .timer{
      direction:ltr;
      font-family:"Arial Black","Segoe UI",Arial,sans-serif;
      font-variant-numeric:tabular-nums;
      color:var(--white);
      font-size:clamp(13rem,34vh,26rem);
      line-height:.70;
      font-weight:950;
      letter-spacing:-.065em;
      text-shadow:
        0 0 16px rgba(255,255,255,.18),
        0 0 54px rgba(28,89,255,.15);
      white-space:nowrap;
    }

    .timer.running{color:var(--white)}
    .timer.finished{color:var(--red)}

    .timer.warning{
      color:var(--red);
      text-shadow:
        0 0 18px rgba(255,57,95,.78),
        0 0 64px rgba(255,57,95,.38);
      animation:warningPulse .72s ease-in-out infinite;
    }

    @keyframes warningPulse{
      0%,100%{transform:scale(1)}
      50%{transform:scale(1.035)}
    }

    .stats{
      min-height:clamp(150px,19vh,220px);
      display:grid;
      grid-template-columns:repeat(5,minmax(0,1fr));
      gap:clamp(10px,1.1vw,18px);
    }

    .stat{
      --accent:var(--blue);
      min-width:0;
      position:relative;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:clamp(4px,.45vh,7px);
      padding:10px 10px 16px;
      border-radius:clamp(22px,2vw,32px);
      background:
        radial-gradient(circle at 50% 0%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 45%),
        linear-gradient(150deg,rgba(5,15,54,.95),rgba(3,8,30,.97));
      border:2px solid var(--accent);
      box-shadow:
        inset 0 0 28px color-mix(in srgb,var(--accent) 7%,transparent),
        0 16px 45px rgba(0,0,0,.25);
    }

    .stat::after{
      content:"";
      position:absolute;
      left:9%;
      right:9%;
      bottom:7px;
      height:5px;
      border-radius:999px;
      background:linear-gradient(
        90deg,
        var(--accent) 0 72%,
        rgba(145,165,224,.20) 72% 100%
      );
      box-shadow:0 0 14px color-mix(in srgb,var(--accent) 50%,transparent);
    }

    .stat-icon{
      color:var(--accent);
      font-size:clamp(1.9rem,3.7vh,3rem);
      line-height:1;
      filter:drop-shadow(0 0 10px color-mix(in srgb,var(--accent) 35%,transparent));
    }

    .stat-label{
      color:var(--white);
      font-size:clamp(1.25rem,2.6vh,1.9rem);
      font-weight:800;
      white-space:nowrap;
    }

    .stat strong{
      color:var(--accent);
      font-family:"Arial Black","Segoe UI",Arial,sans-serif;
      font-size:clamp(3.6rem,7.9vh,6.1rem);
      line-height:.85;
      font-weight:950;
    }

    .stat-killer{--accent:var(--red)}
    .stat-mafia{--accent:var(--pink)}
    .stat-citizen{--accent:var(--cyan)}
    .stat-neutral{--accent:var(--purple)}
    .stat-total{--accent:var(--lime)}

    .night-panel,
    .voting-panel,
    .idle-panel{
      display:none;
      min-height:0;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:clamp(20px,2.6vh,38px);
      text-align:center;
    }

    .large-phase-icon{
      font-size:clamp(9rem,20vh,15rem);
      line-height:1;
      filter:drop-shadow(0 0 40px rgba(255,255,255,.18));
    }

    .large-phase-title{
      font-size:clamp(7rem,16vh,12rem);
      line-height:.88;
      font-weight:900;
    }

    .night-panel .large-phase-title{color:var(--purple)}
    .voting-panel .large-phase-title{color:var(--yellow)}
    .idle-panel .large-phase-title{color:var(--blue)}

    .fullscreen-btn{
      position:fixed;
      left:var(--safe-x);
      bottom:max(10px,calc(var(--safe-y) - 8px));
      z-index:20;
      padding:7px 11px;
      color:#b2bfdc;
      font-size:.68rem;
      font-weight:800;
      border-radius:11px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(4,8,22,.68);
      opacity:.25;
      cursor:pointer;
    }

    .fullscreen-btn:hover{opacity:1}

    body.phase-voting .stage,
    body.phase-night .stage,
    body.phase-idle .stage{
      grid-template-rows:auto minmax(0,1fr) auto;
    }

    body.phase-voting .speaker-card,
    body.phase-voting .timer-panel,
    body.phase-night .speaker-card,
    body.phase-night .timer-panel,
    body.phase-idle .speaker-card,
    body.phase-idle .timer-panel{
      display:none!important;
    }

    body.phase-voting .voting-panel{display:flex}
    body.phase-night .night-panel{display:flex}
    body.phase-idle .idle-panel{display:flex}

    body.phase-voting .phase-heading,
    body.phase-night .phase-heading,
    body.phase-idle .phase-heading{
      display:none;
    }

    @media (min-width:900px) and (max-height:730px){
      :root{
        --safe-x:clamp(36px,3.8vw,72px);
        --safe-y:9px;
        --gap:7px;
      }

      .top-bar{min-height:64px}
      .connection-pill{
        min-height:44px;
        min-width:132px;
        font-size:1rem;
      }

      .phase-title{font-size:3.8rem}
      .round-circle{
        width:84px;
        height:84px;
        font-size:1.35rem;
      }

      .speaker-card{
        min-height:96px;
        padding:8px 24px;
      }

      .speaker-text{font-size:3rem}
      .speaker-mic{
        width:66px;
        height:66px;
        font-size:2.2rem;
      }

      .timer{font-size:clamp(10rem,28vh,16rem)}
      .stats{min-height:118px}
      .stat-icon{font-size:1.65rem}
      .stat-label{font-size:1.05rem}
      .stat strong{font-size:3.2rem}
    }

    @media (max-width:950px){
      .top-bar{
        grid-template-columns:auto 1fr;
      }

      .top-spacer{display:none}

      .phase-heading{
        justify-self:end;
      }

      .stats{
        grid-template-columns:repeat(5,minmax(115px,1fr));
      }
    }

    @media (max-width:800px){
      :root{--safe-x:14px}
      .connection-pill{min-width:112px}
      .phase-title{font-size:clamp(2.8rem,9vw,4.2rem)}
      .round-circle{width:76px;height:76px}
      .speaker-text{font-size:clamp(2rem,6vw,3.2rem)}
      .timer{font-size:clamp(7rem,27vw,12rem)}
      .stats{
        grid-template-columns:repeat(5,minmax(100px,1fr));
        overflow:hidden;
      }
    }

    @media (prefers-reduced-motion:reduce){
      .timer.warning{animation:none}
    }
  </style>
</head>

      <div class="pair-row">

        <div class="stat stat-killer">
          <div class="stat-icon">🔪</div>
          <span class="stat-label">سفاح</span>
          <strong id="killerCount">0</strong>
        </div>

        <div class="stat stat-mafia">
          <div class="stat-icon">🥷</div>
          <span class="stat-label">مافيا</span>
          <strong id="mafiaCount">0</strong>
        </div>

        <div class="stat stat-citizen">
          <div class="stat-icon">👤</div>
          <span class="stat-label">مواطن</span>

        <div class="stat stat-neutral">

        <div class="stat stat-total">
          <div class="stat-icon">👥</div>
          <span class="stat-label">الأحياء</span>
          <strong id="aliveCount">0</strong>
        </div>
      </section>
    </section>

    <button id="fullscreenBtn" class="fullscreen-btn" type="button">ملء الشاشة ⛶</button>
  </main>

  <script>
    (() => {
      try {
        if ("caches" in window) {
          caches.keys().then(keys => {
            keys
              .filter(key =>
                key.startsWith("amman-mafia-tv-") &&
                key !== "amman-mafia-tv-v52-cache-v1"
              )
              .forEach(key => caches.delete(key));
          });
        }
      } catch (_) {}
    })();
  </script>

  <script src="realtime-config.js?v=52"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>

  <script>
  (function(){
    "use strict";

    const PHASE_LABELS = {
      idle: "بانتظار الجولة",
      discussion: "جولة النقاش",
      voting: "جولة التصويت",
      night: "جولة الليل"
    };

    let room = "";
    let state = null;
    let client = null;
    let channel = null;
    let localChannel = null;
    let mode = "local";
    let transportConnected = false;
    let lastStateAt = 0;
    let tick = null;
    let ping = null;
    let syncPoll = null;
    let retryTimer = null;
    let lastLocalWrittenAt = 0;

    const LOCAL_STATE_PREFIX = "ammanMafiaLocalDisplayStateV2:";
    const LOCAL_REQUEST_PREFIX = "ammanMafiaLocalDisplayRequestV2:";
    const LOCAL_PRESENCE_PREFIX = "ammanMafiaLocalDisplayPresenceV2:";
    const $ = id => document.getElementById(id);

    function configured(){
      const config = window.AMMAN_MAFIA_REALTIME || {};
      return (
        /^https:\/\/.+\.supabase\.co\/?$/i.test(String(config.supabaseUrl || "").trim()) &&
        String(config.supabaseAnonKey || "").trim().length > 40 &&
        !String(config.supabaseAnonKey).includes("PUT_YOUR_")
      );
    }

    function getTickThresholdMs(){
      if(!state) return 5000;

      const durationSec = Math.round(
        Math.max(0, Number(state.timerDurationMs) || 0) / 1000
      );

      if(durationSec === 60) return 15000;
      if(durationSec === 45) return 10000;
      if(durationSec === 30) return 5000;

      return durationSec >= 60
        ? 15000
        : (durationSec > 30 ? 10000 : 5000);
    }

    function remaining(){
      if(!state) return 0;

      if(state.timerStatus === "running"){
        return Math.max(
          0,
          Number(state.timerEndsAt || 0) - Date.now()
        );
      }

      return Math.max(
        0,
        Number(state.timerRemainingMs || 0)
      );
    }

    function formatTime(ms){
      const total = Math.max(0, Math.ceil(ms / 1000));
      const minutes = Math.floor(total / 60);
      const seconds = total % 60;

      return `${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;
    }

    function apply(payload){
      if(!payload || typeof payload !== "object") return;
      if(payload.roomCode && room && String(payload.roomCode) !== room) return;

      state = {
        ...payload,
        timerEndsAt: Number(payload.timerEndsAt) || 0,
        timerRemainingMs: Math.max(0, Number(payload.timerRemainingMs) || 0),
        timerDurationMs: Math.max(1000, Number(payload.timerDurationMs) || 60000)
      };

      lastStateAt = Date.now();
      render();
    }

    function localStateKey(){ return LOCAL_STATE_PREFIX + room; }
    function localRequestKey(){ return LOCAL_REQUEST_PREFIX + room; }
    function localPresenceKey(){ return LOCAL_PRESENCE_PREFIX + room; }

    function writeLocalSignal(key,payload){
      try{
        localStorage.setItem(
          key,
          JSON.stringify({
            ...payload,
            at: Date.now(),
            nonce: Math.random().toString(36).slice(2)
          })
        );
      }catch(_){}
    }

    function announcePresence(){
      if(!room) return;
      writeLocalSignal(localPresenceKey(), {type:"display-presence"});
    }

    function requestLocalState(){
      if(!room) return;
      writeLocalSignal(localRequestKey(), {type:"display-request"});
    }

    function pullLocalState(force=false){
      if(!room) return false;

      try{
        const envelope = JSON.parse(
          localStorage.getItem(localStateKey()) || "null"
        );

        if(!envelope || !envelope.payload) return false;

        const writtenAt = Number(envelope.writtenAt) || 0;
        if(!force && writtenAt <= lastLocalWrittenAt) return false;

        lastLocalWrittenAt = writtenAt;
        apply(envelope.payload);
        return true;
      }catch(_){
        return false;
      }
    }

    function handleStorageEvent(event){
      if(!room || !event || event.key !== localStateKey()) return;
      pullLocalState(true);
    }

    function setConnection(isOnline){
      const pill = $("connectionPill");
      pill.classList.toggle("online", Boolean(isOnline));
      $("connectionText").textContent = isOnline ? "متصل" : "غير متصل";
    }

    function updateConnection(){
      const stateFresh = !state || Date.now() - lastStateAt < 22000;
      setConnection(transportConnected && stateFresh);
    }

    function render(){
      if(!state) return;

      const phase = PHASE_LABELS[state.phase]
        ? state.phase
        : "idle";

      document.body.className = `phase-${phase}`;

      $("phaseTitle").textContent = PHASE_LABELS[phase];
      $("roundCircle").innerHTML =
        `الجولة<br>${Math.max(1, Number(state.roundNumber) || 1)}`;

      const speakerSeat = Math.max(0, Number(state.speakerSeat) || 0);
      const speakerVisible =
        Boolean(state.speakerVisible) &&
        speakerSeat > 0 &&
        phase === "discussion";

      $("speakerCard").hidden = !speakerVisible;
      $("speakerPlayerText").textContent =
        speakerVisible
          ? `للاعب رقم ${speakerSeat}`
          : "بانتظار تحديد اللاعب";

      const rem = remaining();
      const rawTimerStatus = state.timerStatus || "idle";
      const timerStatus =
        rawTimerStatus === "running" && rem <= 0
          ? "finished"
          : rawTimerStatus;

      const warning =
        timerStatus === "running" &&
        rem > 0 &&
        rem <= getTickThresholdMs();

      const timer = $("timer");
      timer.textContent = formatTime(rem);
      timer.className =
        `timer ${timerStatus}${warning ? " warning" : ""}`;

      const totalAlive = Math.max(0, Number(state.totalAlive) || 0);
      const citizenAlive = Math.max(0, Number(state.citizenAlive) || 0);
      const mafiaAlive = Math.max(0, Number(state.mafiaAlive) || 0);
      const killerAlive = Math.max(0, Number(state.killerAlive) || 0);

      const suppliedNeutral =
        Number.isFinite(Number(state.neutralAlive))
          ? Math.max(0, Number(state.neutralAlive))
          : null;

      const neutralAlive =
        suppliedNeutral !== null
          ? suppliedNeutral
          : Math.max(
              0,
              totalAlive - citizenAlive - mafiaAlive - killerAlive
            );

      $("aliveCount").textContent = String(totalAlive);
      $("citizenCount").textContent = String(citizenAlive);
      $("mafiaCount").textContent = String(mafiaAlive);
      $("killerCount").textContent = String(killerAlive);
      $("neutralCount").textContent = String(neutralAlive);
    }

    function send(event,payload={}){
      if(mode === "supabase" && channel){
        channel
          .send({type:"broadcast",event,payload})
          .catch(() => {});
        return;
      }

      if(localChannel){
        try{
          localChannel.postMessage({event,payload});
        }catch(_){}
      }

      if(event === "display_request") requestLocalState();
      if(event === "display_ping") announcePresence();
    }

    function setDebug(text,type=""){
      const element = $("debugStatus");
      if(!element) return;

      element.textContent = text || "";
      element.className =
        `debug-status${type ? ` ${type}` : ""}`;
    }

    function readableRealtimeError(status,error){
      return [
        status || "UNKNOWN",
        error?.message || "",
        error?.name || "",
        error?.cause?.message || ""
      ].filter(Boolean).join(" — ") || "Realtime connection failed";
    }

    function scheduleReconnect(){
      clearTimeout(retryTimer);
      retryTimer = setTimeout(() => {
        if(room) connect();
      },3000);
    }

    function showDisplay(){
      $("pairScreen").style.display = "none";
      $("displayScreen").classList.add("active");
    }

    function connect(){
      room = $("roomInput")
        .value
        .trim()
        .toUpperCase()
        .replace(/[^A-Z2-9]/g,"");

      if(room.length < 6){
        $("pairMessage").textContent =
          "أدخل رمز الجلسة الظاهر في لوحة المنظم.";
        return;
      }

      localStorage.setItem("ammanMafiaDisplayLastRoom",room);
      $("pairMessage").textContent = "جاري الاتصال...";
      transportConnected = false;
      setConnection(false);

      try{
        if(localChannel) localChannel.close();
      }catch(_){}

      localChannel = null;
      clearInterval(ping);
      clearInterval(syncPoll);
      clearTimeout(retryTimer);

      if(
        configured() &&
        window.supabase &&
        typeof window.supabase.createClient === "function"
      ){
        mode = "supabase";
        const config = window.AMMAN_MAFIA_REALTIME;

        client = window.supabase.createClient(
          config.supabaseUrl.trim(),
          config.supabaseAnonKey.trim(),
          {
            auth:{
              persistSession:false,
              autoRefreshToken:false,
              detectSessionInUrl:false
            },
            realtime:{
              params:{eventsPerSecond:10}
            }
          }
        );

        channel = client.channel(
          `amman-mafia-display-${room}`,
          {
            config:{
              private:false,
              broadcast:{
                self:false,
                ack:true
              }
            }
          }
        );

        setDebug("Connecting to Supabase Realtime…");

        channel
          .on("broadcast",{event:"state"},({payload}) => {
            setDebug("Realtime state received","ok");
            apply(payload);
          })
          .subscribe((status,error) => {
            setDebug(`Realtime status: ${status}`);

            if(status === "SUBSCRIBED"){
              clearTimeout(retryTimer);
              transportConnected = true;
              lastStateAt = Date.now();
              setConnection(true);
              setDebug("Realtime connected","ok");
              showDisplay();
              send("display_request",{at:Date.now()});
            }else if(
              status === "CHANNEL_ERROR" ||
              status === "TIMED_OUT" ||
              status === "CLOSED"
            ){
              transportConnected = false;
              setConnection(false);
              setDebug(
                readableRealtimeError(status,error),
                "error"
              );

              $("pairMessage").textContent =
                "تعذر ربط شاشة العرض. تحقق من الإنترنت وإعدادات Supabase.";

              scheduleReconnect();
            }
          });
      }else{
        mode = "local";

        if("BroadcastChannel" in window){
          localChannel = new BroadcastChannel(
            `amman-mafia-display-${room}`
          );

          localChannel.onmessage = event => {
            const data = event.data || {};
            if(data.event === "state") apply(data.payload);
          };
        }

        transportConnected = true;
        lastStateAt = Date.now();
        pullLocalState(true);
        showDisplay();
        setConnection(true);
        announcePresence();
        requestLocalState();
        send("display_request",{at:Date.now()});

        $("pairMessage").textContent =
          "وضع محلي — متصل بلوحة المنظم في تبويب آخر.";

        syncPoll = setInterval(() => {
          pullLocalState(false);
          announcePresence();
        },500);
      }

      ping = setInterval(() => {
        send("display_ping",{at:Date.now()});

        if(mode === "local"){
          pullLocalState(false);
          announcePresence();
        }
      },2000);
    }

    $("connectBtn").addEventListener("click",connect);

    $("roomInput").addEventListener("keydown",event => {
      if(event.key === "Enter") connect();
    });

    $("fullscreenBtn").addEventListener("click",() => {
      const element = document.documentElement;

      if(!document.fullscreenElement){
        element.requestFullscreen?.();
      }else{
        document.exitFullscreen?.();
      }
    });

    window.addEventListener("storage",handleStorageEvent);

    const params = new URLSearchParams(location.search);
    const initialRoom = (
      params.get("room") ||
      localStorage.getItem("ammanMafiaDisplayLastRoom") ||
      ""
    ).toUpperCase();

    $("roomInput").value = initialRoom;

    if(params.get("room")) connect();

    tick = setInterval(() => {
      render();
      updateConnection();
    },250);
  })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05070b">
  <title>Amman Mafia — شاشة العرض v50</title>

  <style>
    :root{
      --gold:#d4b65c;
      --cream:#f5ecd8;
      --muted:#8f94a1;
      --blue:#4db7ff;
      --red:#ff515b;
      --purple:#a98cff;
      --orange:#ff9b45;
      --panel:rgba(10,18,31,.72);
      --line:rgba(115,191,255,.30);
      --header-h:clamp(58px,8.5vh,92px);
      --page-pad-x:clamp(18px,2.4vw,48px);
      --page-pad-y:clamp(10px,1.5vh,20px);
      --gap:clamp(7px,1.15vh,15px);
    }

    *{box-sizing:border-box}
    html,body{
      width:100%;
      height:100%;
      min-height:0;
      margin:0;
      overflow:hidden;
      background:#05070b;
      color:var(--cream);
      font-family:"Segoe UI",Tahoma,Arial,sans-serif;
    }

    body{
      background:
        radial-gradient(circle at 50% 5%,rgba(39,121,202,.28),transparent 38%),
        linear-gradient(180deg,#071324 0%,#04070d 72%);
    }

    body.phase-discussion{
      background:
        radial-gradient(circle at 50% 8%,rgba(35,139,229,.36),transparent 43%),
        linear-gradient(180deg,#071a31 0%,#04070e 76%);
    }

    body.phase-voting{
      background:
        radial-gradient(circle at 50% 12%,rgba(203,164,59,.25),transparent 42%),
        linear-gradient(180deg,#191407 0%,#070602 78%);
    }

    body.phase-night{
      background:
        radial-gradient(circle at 50% 15%,rgba(92,67,158,.30),transparent 42%),
        linear-gradient(180deg,#080616 0%,#020204 78%);
    }

    button,input{font:inherit}

    /* Pairing */
    .pair-screen{
      min-height:100dvh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .pair-card{
      width:min(94vw,620px);
      padding:32px;
      text-align:center;
      border-radius:26px;
      border:1px solid rgba(212,182,92,.30);
      background:rgba(10,11,17,.96);
      box-shadow:0 30px 90px rgba(0,0,0,.55);
    }

    .pair-logo{
      width:118px;
      height:118px;
      object-fit:cover;
      border-radius:25px;
      border:1px solid rgba(212,182,92,.45);
      box-shadow:0 16px 50px rgba(0,0,0,.38);
    }

    .pair-brand{
      margin-top:15px;
      color:var(--gold);
      font-size:clamp(1.6rem,4vw,2.4rem);
      font-weight:950;
      letter-spacing:5px;
    }

    .pair-sub{
      margin:8px 0 24px;
      color:var(--muted);
      font-weight:800;
    }

    .pair-row{
      display:flex;
      gap:10px;
      direction:ltr;
    }

    .pair-row input{
      flex:1;
      min-width:0;
      padding:15px;
      text-align:center;
      text-transform:uppercase;
      letter-spacing:4px;
      color:var(--cream);
      font-weight:950;
      border-radius:13px;
      border:1px solid rgba(255,255,255,.12);
      background:#07090e;
    }

    .pair-row button{
      padding:13px 21px;
      border:0;
      border-radius:13px;
      background:var(--gold);
      color:#08080a;
      font-weight:950;
      cursor:pointer;
    }

    .pair-msg{
      min-height:24px;
      margin-top:14px;
      color:#c9bf9a;
      font-size:.86rem;
    }

    .debug-status{
      margin-top:8px;
      color:#777d89;
      direction:ltr;
      text-align:center;
      font-size:.72rem;
      overflow-wrap:anywhere;
    }

    .debug-status.error{color:#ff747a}
    .debug-status.ok{color:#68dc8a}

    /* Display shell */
    .display{
      display:none;
      width:100%;
      height:100dvh;
      min-height:0;
      overflow:hidden;
    }

    .display.active{
      display:grid;
      grid-template-rows:var(--header-h) minmax(0,1fr);
      gap:var(--gap);
      padding:var(--page-pad-y) var(--page-pad-x);
    }

    .tv-header{
      height:100%;
      min-height:0;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      padding-bottom:clamp(7px,1vh,13px);
      border-bottom:1px solid rgba(103,169,232,.22);
    }

    .brand-wrap{
      display:flex;
      align-items:center;
      gap:clamp(10px,1.2vw,18px);
    }

    .brand-logo{
      width:clamp(48px,6.3vh,72px);
      height:clamp(48px,6.3vh,72px);
      object-fit:cover;
      border-radius:clamp(12px,1.3vw,18px);
      border:1px solid rgba(212,182,92,.42);
    }

    .top-brand{
      color:var(--gold);
      font-size:clamp(1.05rem,2.2vh,1.55rem);
      font-weight:950;
      letter-spacing:clamp(2px,.3vw,5px);
      line-height:1;
    }

    .top-subtitle{
      margin-top:5px;
      color:#7d8491;
      font-size:clamp(.62rem,1.15vh,.86rem);
      font-weight:850;
      letter-spacing:.6px;
    }

    .connection{
      display:flex;
      align-items:center;
      gap:9px;
      color:#a5a9b3;
      font-size:clamp(.78rem,1.45vh,1.02rem);
      font-weight:850;
    }

    .connection i{
      width:10px;
      height:10px;
      border-radius:50%;
      background:#c99b39;
      flex:0 0 auto;
    }

    .connection.online{
      color:#76df95;
    }

    .connection.online i{
      background:#68e18e;
      box-shadow:0 0 14px rgba(104,225,142,.85);
    }

    /* Responsive stage: sizes are based on the TV viewport height. */
    .stage{
      min-height:0;
      height:100%;
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:var(--gap);
      overflow:hidden;
    }

    .phase-panel{
      flex:0 0 clamp(92px,13.2vh,145px);
      min-height:0;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:clamp(12px,1.6vw,25px);
      text-align:center;
    }

    .round{
      position:absolute;
      top:calc(var(--header-h) + var(--page-pad-y) + var(--gap) + 3px);
      left:50%;
      transform:translateX(-50%);
      z-index:2;
      padding:clamp(5px,.75vh,9px) clamp(17px,1.6vw,28px);
      color:var(--gold);
      font-size:clamp(.84rem,1.65vh,1.15rem);
      font-weight:950;
      border-radius:999px;
      border:1px solid rgba(212,182,92,.40);
      background:rgba(212,182,92,.09);
      white-space:nowrap;
    }

    .phase-icon{
      font-size:clamp(3.1rem,7.2vh,5.5rem);
      line-height:1;
      filter:drop-shadow(0 12px 30px rgba(0,0,0,.35));
    }

    .phase{
      font-size:clamp(3.2rem,8.2vh,6.4rem);
      line-height:.95;
      font-weight:950;
      letter-spacing:-.025em;
      text-shadow:0 10px 34px rgba(0,0,0,.35);
    }

    .phase.discussion{color:var(--blue)}
    .phase.voting{color:var(--gold)}
    .phase.night{color:var(--purple)}

    .phase-subtitle{
      margin-top:clamp(5px,.7vh,10px);
      color:#a2a6b0;
      font-size:clamp(.82rem,1.6vh,1.15rem);
      font-weight:850;
    }

    .speaker-card{
      flex:0 0 clamp(90px,13.5vh,145px);
      width:min(96vw,1540px);
      min-height:0;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:clamp(18px,2.2vw,36px);
      padding:clamp(10px,1.5vh,20px) clamp(26px,3vw,52px);
      border-radius:clamp(20px,2vw,32px);
      border:2px solid rgba(71,179,255,.56);
      background:
        radial-gradient(circle at 20% 0%,rgba(38,159,240,.20),transparent 38%),
        linear-gradient(145deg,rgba(13,47,78,.76),rgba(6,14,26,.82));
      box-shadow:0 18px 58px rgba(0,0,0,.28);
    }

    .speaker-card[hidden]{display:none!important}

    .speaker-mic{
      width:clamp(64px,8.7vh,100px);
      height:clamp(64px,8.7vh,100px);
      display:grid;
      place-items:center;
      flex:0 0 auto;
      border-radius:50%;
      font-size:clamp(2.2rem,5vh,4rem);
      background:rgba(76,183,255,.13);
      border:1px solid rgba(76,183,255,.45);
    }

    .speaker-copy{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:clamp(3px,.45vh,7px);
    }

    .speaker-copy span{
      color:#a7b0ba;
      font-size:clamp(.82rem,1.55vh,1.08rem);
      font-weight:900;
    }

    .speaker-copy strong{
      color:#8cd2ff;
      font-size:clamp(3.1rem,7.4vh,5.8rem);
      line-height:.9;
      font-weight:950;
      text-shadow:0 0 30px rgba(67,175,245,.20);
    }

    .timer-panel{
      flex:1 1 auto;
      width:min(96vw,1540px);
      min-height:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:clamp(9px,1.25vh,18px) clamp(22px,2.7vw,48px);
      border-radius:clamp(22px,2.3vw,36px);
      border:2px solid rgba(82,151,219,.42);
      background:
        radial-gradient(circle at 50% 10%,rgba(64,132,205,.13),transparent 55%),
        rgba(7,15,29,.67);
      box-shadow:0 22px 64px rgba(0,0,0,.24);
    }

    .timer{
      direction:ltr;
      font-variant-numeric:tabular-nums;
      color:var(--cream);
      font-size:clamp(9rem,25vh,19rem);
      line-height:.74;
      font-weight:950;
      letter-spacing:-.055em;
      text-shadow:0 0 48px rgba(212,182,92,.10);
      white-space:nowrap;
    }

    .timer.running{color:var(--gold)}
    .timer.finished{color:var(--red)}

    .timer.warning{
      color:#ff515b;
      text-shadow:
        0 0 18px rgba(255,81,91,.72),
        0 0 60px rgba(255,42,59,.35);
      animation:warningPulse .72s ease-in-out infinite;
    }

    @keyframes warningPulse{
      0%,100%{transform:scale(1)}
      50%{transform:scale(1.035)}
    }

    .timer-label{
      margin-top:clamp(6px,.8vh,11px);
      color:#9fa4ae;
      font-size:clamp(.84rem,1.55vh,1.08rem);
      font-weight:850;
    }

    .timer-label.warning-label{
      color:#ff757c;
      font-weight:950;
    }

    .stats{
      flex:0 0 clamp(86px,12.2vh,132px);
      width:min(96vw,1540px);
      min-height:0;
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:clamp(8px,1vw,16px);
    }

    .stats:has(.stat.killer:not([hidden])){
      grid-template-columns:repeat(4,minmax(0,1fr));
    }

    .stat{
      min-width:0;
      height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:clamp(3px,.5vh,7px);
      padding:7px 10px;
      border-radius:clamp(15px,1.6vw,24px);
      background:rgba(9,18,32,.76);
      border:2px solid rgba(255,255,255,.12);
    }

    .stat-label{
      color:#a0a5af;
      font-size:clamp(.76rem,1.45vh,1rem);
      font-weight:900;
    }

    .stat strong{
      font-size:clamp(2.6rem,6.2vh,4.8rem);
      line-height:.9;
      font-weight:950;
    }

    .stat.total{border-color:rgba(212,182,92,.55)}
    .stat.total strong{color:#e4c96e}
    .stat.citizen{border-color:rgba(76,183,255,.55)}
    .stat.citizen strong{color:#65c1fb}
    .stat.mafia{border-color:rgba(255,81,91,.55)}
    .stat.mafia strong{color:#ff6570}
    .stat.killer{border-color:rgba(255,155,69,.62)}
    .stat.killer strong{color:#ffac62}

    .night-panel{
      display:none;
      flex:1 1 auto;
      min-height:0;
      width:min(94vw,1300px);
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:clamp(15px,2.2vh,30px);
      text-align:center;
    }

    .night-moon{
      width:clamp(180px,27vh,320px);
      height:clamp(180px,27vh,320px);
      border-radius:50%;
      background:
        radial-gradient(circle at 35% 30%,#f0ebff 0 7%,#b7a8ec 29%,#7461b8 60%,#3b2c68 100%);
      box-shadow:
        0 0 65px rgba(143,115,221,.42),
        0 0 160px rgba(91,68,159,.20);
    }

    .night-title{
      color:#c4b4f4;
      font-size:clamp(4.6rem,11vh,8.8rem);
      line-height:.9;
      font-weight:950;
      text-shadow:0 0 45px rgba(143,115,221,.24);
    }

    .night-copy{
      color:#9b96ad;
      font-size:clamp(1rem,2vh,1.45rem);
      font-weight:850;
    }

    .fullscreen-btn{
      position:fixed;
      left:14px;
      bottom:12px;
      z-index:20;
      padding:8px 12px;
      color:#b3b6bd;
      font-size:.72rem;
      font-weight:850;
      border-radius:11px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(9,12,18,.64);
      opacity:.45;
      cursor:pointer;
    }

    .fullscreen-btn:hover{opacity:1}

    /* Phase-specific layout */
    body.phase-voting .speaker-card,
    body.phase-voting .timer-panel{
      display:none!important;
    }

    body.phase-voting .stage{
      justify-content:space-between;
    }

    body.phase-voting .phase-panel{
      flex:1 1 auto;
      width:100%;
    }

    body.phase-voting .phase-icon{
      font-size:clamp(7rem,16vh,12rem);
    }

    body.phase-voting .phase{
      font-size:clamp(6rem,14vh,11rem);
    }

    body.phase-voting .phase-subtitle{
      font-size:clamp(1rem,2.2vh,1.55rem);
    }

    body.phase-night .phase-panel,
    body.phase-night .speaker-card,
    body.phase-night .timer-panel,
    body.phase-night .stats{
      display:none!important;
    }

    body.phase-night .night-panel{
      display:flex;
    }

    /* Short TV browser viewport: reduce only enough to fit, never zoom whole page. */
    @media (min-width:900px) and (max-height:720px){
      :root{
        --header-h:52px;
        --page-pad-y:7px;
        --gap:6px;
      }

      .brand-logo{width:42px;height:42px}
      .top-brand{font-size:1.02rem}
      .top-subtitle{display:none}
      .connection{font-size:.76rem}

      .phase-panel{flex-basis:76px}
      .phase-icon{font-size:2.9rem}
      .phase{font-size:3.15rem}
      .phase-subtitle{font-size:.76rem;margin-top:3px}

      .speaker-card{
        flex-basis:76px;
        padding:7px 24px;
      }

      .speaker-mic{
        width:52px;
        height:52px;
        font-size:1.85rem;
      }

      .speaker-copy strong{font-size:2.7rem}
      .speaker-copy span{font-size:.76rem}

      .timer{font-size:clamp(7.6rem,21vh,11.2rem)}
      .timer-label{font-size:.76rem}

      .stats{flex-basis:72px}
      .stat strong{font-size:2.1rem}
      .stat-label{font-size:.7rem}

      .round{
        font-size:.76rem;
        padding:4px 13px;
      }

      .night-moon{
        width:155px;
        height:155px;
      }

      .night-title{font-size:4.2rem}
    }

    @media (max-width:800px){
      :root{--page-pad-x:12px}
      .top-subtitle{display:none}
      .phase{font-size:clamp(2.2rem,8vw,4rem)}
      .timer{font-size:clamp(5.4rem,24vw,10rem)}
      .stats,.stats:has(.stat.killer:not([hidden])){
        grid-template-columns:repeat(2,minmax(0,1fr));
        flex-basis:auto;
      }
    }

    @media (prefers-reduced-motion:reduce){
      .timer.warning{animation:none}
    }
  
    /* ===== v50: Television safe area + no title overlap ===== */

    :root{
      /*
       * تلفزيونات كثيرة تقص 2–4% من الصورة بسبب Overscan.
       * لذلك كل المحتوى الرئيسي يبقى داخل هذه المنطقة الآمنة.
       */
      --tv-safe-x:clamp(42px,4.5vw,92px);
      --tv-safe-top:clamp(16px,2.2vh,30px);
      --tv-safe-bottom:clamp(28px,4vh,56px);
      --content-max:1500px;
    }

    .display.active{
      padding:
        var(--tv-safe-top)
        var(--tv-safe-x)
        var(--tv-safe-bottom);
    }

    .tv-header,
    .stage{
      width:min(100%,var(--content-max));
      max-width:100%;
      margin-inline:auto;
    }

    .stage{
      position:relative;
    }

    .phase-panel{
      width:100%;
      flex-basis:clamp(118px,17vh,184px);
      padding-top:0;
    }

    .phase-content{
      width:100%;
      height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:clamp(6px,.9vh,12px);
      text-align:center;
    }

    .phase-row{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:clamp(12px,1.6vw,25px);
    }

    .round{
      position:static;
      inset:auto;
      transform:none;
      z-index:auto;
      flex:0 0 auto;
      margin:0;
    }

    .speaker-card,
    .timer-panel,
    .stats{
      width:100%;
      max-width:100%;
      min-width:0;
    }

    .stat{
      min-width:0;
    }

    /*
     * كانت المشكلة السابقة: 96vw + padding خارجي.
     * الآن العرض 100% من المنطقة الداخلية الآمنة فقط.
     */
    .speaker-card{
      width:100%;
    }

    .timer-panel{
      width:100%;
    }

    .stats,
    .stats:has(.stat.killer:not([hidden])){
      width:100%;
    }

    .fullscreen-btn{
      left:var(--tv-safe-x);
      bottom:max(10px,calc(var(--tv-safe-bottom) - 24px));
    }

    body.phase-voting .phase-panel{
      width:100%;
    }

    body.phase-night .night-panel{
      width:100%;
      max-width:var(--content-max);
    }

    /* مساحة آمنة أكبر قليلًا في الشاشات ذات القص الواضح. */
    @media (min-width:1200px){
      :root{
        --tv-safe-x:clamp(58px,5vw,104px);
      }
    }

    /* متصفح تلفزيون بارتفاع قصير: نحافظ على الحجم مع تقليل الفراغ فقط. */
    @media (min-width:900px) and (max-height:720px){
      :root{
        --tv-safe-x:clamp(42px,4.2vw,78px);
        --tv-safe-top:9px;
        --tv-safe-bottom:24px;
      }

      .phase-panel{
        flex-basis:96px;
      }

      .phase-content{
        gap:4px;
      }

      .round{
        font-size:.72rem;
        padding:3px 12px;
      }
    }

  </style>
</head>
<body>
  <section id="pairScreen" class="pair-screen">
    <div class="pair-card">
      <img class="pair-logo" src="app-icon-master.png" alt="Amman Mafia">
      <div class="pair-brand">AMMAN MAFIA</div>
      <div class="pair-sub">شاشة اللاعبين</div>

      <div class="pair-row">
        <input id="roomInput" maxlength="14" placeholder="رمز الجلسة" autocomplete="off">
        <button id="connectBtn" type="button">اتصال</button>
      </div>

      <div id="pairMessage" class="pair-msg"></div>
      <div id="debugStatus" class="debug-status"></div>
    </div>
  </section>

  <main id="displayScreen" class="display">
    <header class="tv-header">
      <div class="brand-wrap">
        <img class="brand-logo" src="app-icon-master.png" alt="Amman Mafia">
        <div>
          <div class="top-brand">AMMAN MAFIA</div>
          <div class="top-subtitle">LIVE GAME DISPLAY</div>
        </div>
      </div>

      <div id="connection" class="connection">
        <i></i>
        <span>جاري الاتصال</span>
      </div>
    </header>

    <section class="stage">
      <section class="phase-panel">
        <div class="phase-content">
          <div id="round" class="round">الجولة 1</div>

          <div class="phase-row">
            <div id="phaseIcon" class="phase-icon">⌛</div>
            <div>
              <div id="phase" class="phase">بانتظار بدء الجولة</div>
              <div id="phaseSubtitle" class="phase-subtitle">بانتظار إشارة المنظّم</div>
            </div>
          </div>
        </div>
      </section>

      <section id="speakerCard" class="speaker-card" hidden>
        <div class="speaker-mic">🎙️</div>
        <div class="speaker-copy">
          <span>دور الكلام الحالي</span>
          <strong id="speakerSeatText">لاعب —</strong>
        </div>
      </section>

      <section class="timer-panel">
        <div id="timer" class="timer">01:00</div>
        <div id="timerLabel" class="timer-label">المؤقت جاهز</div>
      </section>

      <section class="night-panel" aria-label="جولة الليل">
        <div class="night-moon"></div>
        <div class="night-title">جولة الليل</div>
        <div class="night-copy">أغمضوا أعينكم… المنظّم يدير أحداث الليل</div>
      </section>

      <section class="stats" aria-label="أعداد اللاعبين الأحياء">
        <div class="stat total">
          <span class="stat-label">الأحياء</span>
          <strong id="aliveCount">0</strong>
        </div>

        <div class="stat citizen">
          <span class="stat-label">مواطن</span>
          <strong id="citizenCount">0</strong>
        </div>

        <div class="stat mafia">
          <span class="stat-label">مافيا</span>
          <strong id="mafiaCount">0</strong>
        </div>

        <div id="killerStat" class="stat killer" hidden>
          <span class="stat-label">سفاح</span>
          <strong id="killerCount">0</strong>
        </div>
      </section>
    </section>

    <button id="fullscreenBtn" class="fullscreen-btn" type="button">ملء الشاشة ⛶</button>
  </main>

  <script>
    (() => {
      try {
        if ("caches" in window) {
          caches.keys().then(keys => {
            keys
              .filter(key =>
                key.startsWith("amman-mafia-tv-") &&
                key !== "amman-mafia-tv-v50-cache-v1"
              )
              .forEach(key => caches.delete(key));
          });
        }
      } catch (_) {}
    })();
  </script>

  <script src="realtime-config.js?v=50"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>

  <script>
  (function(){
    "use strict";

    const PHASE_LABELS = {
      idle: "بانتظار بدء الجولة",
      discussion: "جولة النقاش",
      voting: "جولة التصويت",
      night: "جولة الليل"
    };

    const PHASE_UI = {
      idle: {
        icon: "⌛",
        subtitle: "بانتظار إشارة المنظّم"
      },
      discussion: {
        icon: "💬",
        subtitle: "تحدثوا، ناقشوا، واكشفوا المافيا"
      },
      voting: {
        icon: "🗳️",
        subtitle: "اختاروا اللاعب الذي تشكون به"
      },
      night: {
        icon: "🌙",
        subtitle: "أغمضوا أعينكم"
      }
    };

    let room = "";
    let state = null;
    let client = null;
    let channel = null;
    let localChannel = null;
    let mode = "local";
    let lastStateAt = 0;
    let tick = null;
    let ping = null;
    let syncPoll = null;
    let retryTimer = null;
    let lastLocalWrittenAt = 0;

    const LOCAL_STATE_PREFIX = "ammanMafiaLocalDisplayStateV2:";
    const LOCAL_REQUEST_PREFIX = "ammanMafiaLocalDisplayRequestV2:";
    const LOCAL_PRESENCE_PREFIX = "ammanMafiaLocalDisplayPresenceV2:";
    const $ = id => document.getElementById(id);

    function configured(){
      const config = window.AMMAN_MAFIA_REALTIME || {};
      return (
        /^https:\/\/.+\.supabase\.co\/?$/i.test(String(config.supabaseUrl || "").trim()) &&
        String(config.supabaseAnonKey || "").trim().length > 40 &&
        !String(config.supabaseAnonKey).includes("PUT_YOUR_")
      );
    }

    function getTickThresholdMs(){
      if(!state) return 5000;

      const durationSec = Math.round(
        Math.max(0, Number(state.timerDurationMs) || 0) / 1000
      );

      if(durationSec === 60) return 15000;
      if(durationSec === 45) return 10000;
      if(durationSec === 30) return 5000;

      return durationSec >= 60
        ? 15000
        : (durationSec > 30 ? 10000 : 5000);
    }

    function remaining(){
      if(!state) return 0;

      if(state.timerStatus === "running"){
        return Math.max(
          0,
          Number(state.timerEndsAt || 0) - Date.now()
        );
      }

      return Math.max(
        0,
        Number(state.timerRemainingMs || 0)
      );
    }

    function formatTime(ms){
      const total = Math.max(0, Math.ceil(ms / 1000));
      const minutes = Math.floor(total / 60);
      const seconds = total % 60;

      return `${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;
    }

    function apply(payload){
      if(!payload || typeof payload !== "object") return;
      if(payload.roomCode && room && String(payload.roomCode) !== room) return;

      state = {
        ...payload,
        timerEndsAt: Number(payload.timerEndsAt) || 0,
        timerRemainingMs: Math.max(0, Number(payload.timerRemainingMs) || 0),
        timerDurationMs: Math.max(1000, Number(payload.timerDurationMs) || 60000)
      };

      lastStateAt = Date.now();
      render();
    }

    function localStateKey(){ return LOCAL_STATE_PREFIX + room; }
    function localRequestKey(){ return LOCAL_REQUEST_PREFIX + room; }
    function localPresenceKey(){ return LOCAL_PRESENCE_PREFIX + room; }

    function writeLocalSignal(key,payload){
      try{
        localStorage.setItem(
          key,
          JSON.stringify({
            ...payload,
            at: Date.now(),
            nonce: Math.random().toString(36).slice(2)
          })
        );
      }catch(_){}
    }

    function announcePresence(){
      if(!room) return;
      writeLocalSignal(localPresenceKey(), {type:"display-presence"});
    }

    function requestLocalState(){
      if(!room) return;
      writeLocalSignal(localRequestKey(), {type:"display-request"});
    }

    function pullLocalState(force=false){
      if(!room) return false;

      try{
        const envelope = JSON.parse(
          localStorage.getItem(localStateKey()) || "null"
        );

        if(!envelope || !envelope.payload) return false;

        const writtenAt = Number(envelope.writtenAt) || 0;
        if(!force && writtenAt <= lastLocalWrittenAt) return false;

        lastLocalWrittenAt = writtenAt;
        apply(envelope.payload);
        return true;
      }catch(_){
        return false;
      }
    }

    function handleStorageEvent(event){
      if(!room || !event || event.key !== localStateKey()) return;
      pullLocalState(true);
    }

    function render(){
      if(!state) return;

      const phase = PHASE_LABELS[state.phase]
        ? state.phase
        : "idle";

      const phaseInfo = PHASE_UI[phase] || PHASE_UI.idle;

      document.body.classList.toggle("phase-discussion", phase === "discussion");
      document.body.classList.toggle("phase-voting", phase === "voting");
      document.body.classList.toggle("phase-night", phase === "night");

      $("round").textContent =
        `الجولة ${Math.max(1, Number(state.roundNumber) || 1)}`;

      $("phase").textContent = PHASE_LABELS[phase];
      $("phase").className = `phase ${phase}`;
      $("phaseIcon").textContent = phaseInfo.icon;
      $("phaseSubtitle").textContent = phaseInfo.subtitle;

      const speakerSeat = Math.max(0, Number(state.speakerSeat) || 0);
      const speakerVisible =
        Boolean(state.speakerVisible) &&
        speakerSeat > 0 &&
        phase === "discussion";

      $("speakerCard").hidden = !speakerVisible;

      if(speakerVisible){
        $("speakerSeatText").textContent = `لاعب ${speakerSeat}`;
      }

      const rem = remaining();
      const rawTimerStatus = state.timerStatus || "idle";
      const timerStatus =
        rawTimerStatus === "running" && rem <= 0
          ? "finished"
          : rawTimerStatus;

      const warning =
        timerStatus === "running" &&
        rem > 0 &&
        rem <= getTickThresholdMs();

      const timer = $("timer");
      timer.textContent = formatTime(rem);
      timer.className =
        `timer ${timerStatus}${warning ? " warning" : ""}`;

      const labels = {
        idle: "المؤقت جاهز",
        running: "الوقت المتبقي",
        paused: "المؤقت متوقف مؤقتًا",
        finished: "انتهى الوقت"
      };

      const timerLabel = $("timerLabel");
      timerLabel.textContent = warning
        ? "الوقت يوشك على الانتهاء"
        : (labels[timerStatus] || "المؤقت جاهز");

      timerLabel.classList.toggle("warning-label", warning);

      $("aliveCount").textContent =
        String(Math.max(0, Number(state.totalAlive) || 0));

      $("citizenCount").textContent =
        String(Math.max(0, Number(state.citizenAlive) || 0));

      $("mafiaCount").textContent =
        String(Math.max(0, Number(state.mafiaAlive) || 0));

      $("killerCount").textContent =
        String(Math.max(0, Number(state.killerAlive) || 0));

      $("killerStat").hidden = !Boolean(state.showKiller);
    }

    function updateConnectionStatus(){
      const online = Date.now() - lastStateAt < 18000;
      const element = $("connection");

      element.className = `connection ${online ? "online" : ""}`;
      element.querySelector("span").textContent = online
        ? "متصل بلوحة المنظم"
        : (mode === "supabase" ? "بانتظار لوحة المنظم" : "تجربة محلية");
    }

    function send(event,payload={}){
      if(mode === "supabase" && channel){
        channel
          .send({type:"broadcast",event,payload})
          .catch(() => {});
        return;
      }

      if(localChannel){
        try{
          localChannel.postMessage({event,payload});
        }catch(_){}
      }

      if(event === "display_request") requestLocalState();
      if(event === "display_ping") announcePresence();
    }

    function setDebug(text,type=""){
      const element = $("debugStatus");
      if(!element) return;

      element.textContent = text || "";
      element.className =
        `debug-status${type ? ` ${type}` : ""}`;
    }

    function readableRealtimeError(status,error){
      return [
        status || "UNKNOWN",
        error?.message || "",
        error?.name || "",
        error?.cause?.message || ""
      ].filter(Boolean).join(" — ") || "Realtime connection failed";
    }

    function scheduleReconnect(){
      clearTimeout(retryTimer);
      retryTimer = setTimeout(() => {
        if(room) connect();
      },3000);
    }

    function showDisplay(){
      $("pairScreen").style.display = "none";
      $("displayScreen").classList.add("active");
    }

    function connect(){
      room = $("roomInput")
        .value
        .trim()
        .toUpperCase()
        .replace(/[^A-Z2-9]/g,"");

      if(room.length < 6){
        $("pairMessage").textContent =
          "أدخل رمز الجلسة الظاهر في لوحة المنظم.";
        return;
      }

      localStorage.setItem("ammanMafiaDisplayLastRoom",room);
      $("pairMessage").textContent = "جاري الاتصال...";

      try{
        if(localChannel) localChannel.close();
      }catch(_){}

      localChannel = null;
      clearInterval(ping);
      clearInterval(syncPoll);
      clearTimeout(retryTimer);

      if(
        configured() &&
        window.supabase &&
        typeof window.supabase.createClient === "function"
      ){
        mode = "supabase";
        const config = window.AMMAN_MAFIA_REALTIME;

        client = window.supabase.createClient(
          config.supabaseUrl.trim(),
          config.supabaseAnonKey.trim(),
          {
            auth:{
              persistSession:false,
              autoRefreshToken:false,
              detectSessionInUrl:false
            },
            realtime:{
              params:{eventsPerSecond:10}
            }
          }
        );

        channel = client.channel(
          `amman-mafia-display-${room}`,
          {
            config:{
              private:false,
              broadcast:{
                self:false,
                ack:true
              }
            }
          }
        );

        setDebug("Connecting to Supabase Realtime…");

        channel
          .on("broadcast",{event:"state"},({payload}) => {
            setDebug("Realtime state received","ok");
            apply(payload);
          })
          .subscribe((status,error) => {
            setDebug(`Realtime status: ${status}`);

            if(status === "SUBSCRIBED"){
              clearTimeout(retryTimer);
              setDebug("Realtime connected","ok");
              showDisplay();
              send("display_request",{at:Date.now()});
            }else if(
              status === "CHANNEL_ERROR" ||
              status === "TIMED_OUT" ||
              status === "CLOSED"
            ){
              setDebug(
                readableRealtimeError(status,error),
                "error"
              );

              $("pairMessage").textContent =
                "تعذر ربط شاشة العرض. تحقق من الإنترنت وإعدادات Supabase.";

              scheduleReconnect();
            }
          });
      }else{
        mode = "local";

        if("BroadcastChannel" in window){
          localChannel = new BroadcastChannel(
            `amman-mafia-display-${room}`
          );

          localChannel.onmessage = event => {
            const data = event.data || {};
            if(data.event === "state") apply(data.payload);
          };
        }

        pullLocalState(true);
        showDisplay();
        announcePresence();
        requestLocalState();
        send("display_request",{at:Date.now()});

        $("pairMessage").textContent =
          "وضع محلي — متصل بلوحة المنظم في تبويب آخر.";

        syncPoll = setInterval(() => {
          pullLocalState(false);
          announcePresence();
        },500);
      }

      ping = setInterval(() => {
        send("display_ping",{at:Date.now()});

        if(mode === "local"){
          pullLocalState(false);
          announcePresence();
        }
      },2000);
    }

    $("connectBtn").addEventListener("click",connect);

    $("roomInput").addEventListener("keydown",event => {
      if(event.key === "Enter") connect();
    });

    $("fullscreenBtn").addEventListener("click",() => {
      const element = document.documentElement;

      if(!document.fullscreenElement){
        element.requestFullscreen?.();
      }else{
        document.exitFullscreen?.();
      }
    });

    window.addEventListener("storage",handleStorageEvent);

    const params = new URLSearchParams(location.search);
    const initialRoom = (
      params.get("room") ||
      localStorage.getItem("ammanMafiaDisplayLastRoom") ||
      ""
    ).toUpperCase();

    $("roomInput").value = initialRoom;

    if(params.get("room")) connect();

    tick = setInterval(() => {
      render();
      updateConnectionStatus();
    },250);
  })();
  </script>
